<title>Exam Prep Playground</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exam Prep">
<style>
/* Layout: one column of cards under a sticky segment bar; topic tiles in a wrapping grid */
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2230;--mute:#5f6b7d;--pri:#3451c7;--ok:#22803a;--bad:#c22f2f;--line:#dde2ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1b212b;--ink:#e6eaf1;--mute:#97a2b4;--pri:#8199ff;--ok:#5ccf75;--bad:#ff7474;--line:#2b3341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1b212b;--ink:#e6eaf1;--mute:#97a2b4;--pri:#8199ff;--ok:#5ccf75;--bad:#ff7474;--line:#2b3341;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
main{max-width:900px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0}
h1{font-size:1.25rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button,input,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 14px;min-height:44px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.pri{background:var(--pri);color:var(--card);border:0}
input{width:100%;margin:6px 0}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button[aria-pressed="true"]{background:var(--pri);color:var(--card);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.topic{text-align:left;display:flex;flex-direction:column;gap:4px;margin:0}
.tag{font-size:.78rem;color:var(--mute)}.old{color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{text-align:left}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mute{color:var(--mute)}.wide{overflow-x:auto}
table{border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums}td,th{border:1px solid var(--line);padding:4px 10px;text-align:right}
svg{max-width:100%;height:auto}
#lb ul{padding-left:1.2em;display:grid;gap:6px;max-width:68ch;margin:0 0 8px}
#lb h3{font-size:.95rem;margin:16px 0 6px;color:var(--pri)}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
</style>
<main>
<header><h1>Exam Prep Playground</h1><div id="who" class="row mute">Connecting…</div></header>

<section id="login" class="card" hidden>
  <h2>Sign in on this device</h2>
  <p class="mute">Cloud sync is not available here, so this profile and its scores stay on this device. Open the page from claude.ai to sync across devices.</p>
  <input id="u" placeholder="Name" autocomplete="username">
  <input id="p" type="password" placeholder="PIN" autocomplete="current-password">
  <div class="row"><button class="pri" onclick="login()">Sign in</button><button onclick="login(1)">Create profile</button></div>
  <p id="lmsg" class="mute"></p>
</section>

<section id="home" hidden>
  <nav id="tabs" class="tabs" aria-label="Exam"></nav>
  <div class="card row">
    <select id="filter" onchange="drawTopics()" aria-label="Topic filter"><option value="all">All topics</option><option value="new">New topics</option><option value="old">Old (ticked) topics</option></select>
    <select id="count" aria-label="Questions per quiz"><option>5</option><option selected>10</option><option>20</option></select>
    <button class="pri" onclick="startMix()">Mixed quiz</button>
    <span id="segInfo" class="mute"></span>
  </div>
  <div id="topics" class="grid"></div>
  <div class="card"><h2>Score trend</h2><select id="trendSel" onchange="drawTrend()" aria-label="Trend for"></select><div id="trend" class="wide"></div><p id="weak" class="mute"></p></div>
</section>

<section id="learn" class="card" hidden>
  <p class="tag">Learn first</p><div class="row" style="justify-content:space-between"><h2 id="lt"></h2><button class="pri" onclick="$('lgo').click()">Skip to questions</button></div><div id="lb"></div>
  <div class="row"><button id="lgo" class="pri">Start questions</button><button onclick="show('home')">Back</button></div>
</section>

<section id="quiz" class="card" hidden>
  <div class="row" style="justify-content:space-between"><b id="qt"></b><span id="qn" class="mute"></span></div>
  <div id="qv" class="wide"></div><p id="qq" style="font-size:1.1rem"></p>
  <div id="qo" class="opts"></div>
  <p id="qf"></p>
  <div class="row"><button id="next" class="pri" hidden onclick="next()">Next</button><button id="quit" onclick="show('home')">Quit</button></div>
</section>
</main>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],G=(a,b)=>b?G(b,a%b):a;
const frac=(n,d)=>{const g=G(n,d);return d/g==1?''+n/g:`${n/g}/${d/g}`};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fact=n=>n<2?1:n*fact(n-1);
// Ticked in the book's contents = "old" (already covered)
const OLD=[6,12,16,28,30,31,32];
const bars=(lab,v,unit)=>{const m=Math.max(...v),w=60;return `<svg viewBox="0 0 ${v.length*w+20} 170">${v.map((x,i)=>`<rect x="${i*w+20}" y="${150-x/m*130}" width="40" height="${x/m*130}" fill="var(--pri)"/><text x="${i*w+40}" y="${145-x/m*130}" font-size="11" text-anchor="middle" fill="currentColor">${x}</text><text x="${i*w+40}" y="165" font-size="11" text-anchor="middle" fill="currentColor">${lab[i]}</text>`).join('')}</svg><div class="mute">${unit}</div>`};
const line=(lab,v,unit)=>{const m=Math.max(...v),w=60,pts=v.map((x,i)=>`${i*w+40},${150-x/m*130}`);return `<svg viewBox="0 0 ${v.length*w+20} 170"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--pri)" stroke-width="2"/>${v.map((x,i)=>`<circle cx="${i*w+40}" cy="${150-x/m*130}" r="4" fill="var(--pri)"/><text x="${i*w+40}" y="${142-x/m*130}" font-size="11" text-anchor="middle" fill="currentColor">${x}</text><text x="${i*w+40}" y="165" font-size="11" text-anchor="middle" fill="currentColor">${lab[i]}</text>`).join('')}</svg><div class="mute">${unit}</div>`};
const YRS=['2019','2020','2021','2022','2023'];
const diQ=v=>{const t=v.reduce((a,b)=>a+b),i=R(1,4),k=R(0,2);
  if(k==0)return{q:'Total over all years?',a:t};
  if(k==1)return{q:'Average per year?',a:+(t/5).toFixed(1)};
  return{q:`Percent change from ${YRS[i-1]} to ${YRS[i]} (1 decimal)?`,a:+((v[i]-v[i-1])/v[i-1]*100).toFixed(1)}};
// Each topic: name + generator returning {q, a, opts?, v?(visual html), h?(hint)}
const T=[
['Numbers',()=>{const b=R(2,9),n=R(10,99);return{q:`Unit digit of ${b}^${n}?`,a:Number(BigInt(b)**BigInt(n)%10n),h:'Unit digits repeat in cycles of 4.'}}],
['H.C.F. & L.C.M.',()=>{const g=R(2,12),x=R(2,9),y=P([...Array(9)].map((_,i)=>i+2).filter(z=>G(z,x)==1));return R(0,1)?{q:`HCF of ${g*x} and ${g*y}?`,a:g}:{q:`LCM of ${g*x} and ${g*y}?`,a:g*x*y,h:'HCF × LCM = product of the numbers.'}}],
['Decimal Fractions',()=>{const x=R(11,99),y=R(11,99);return{q:`${x/10} × ${y/10} = ?`,a:+(x*y/100).toFixed(2)}}],
['Simplification',()=>{const a=R(10,50),b=R(2,12),c=R(2,12),d=R(1,20);return{q:`${a} + ${b} × ${c} − ${d} = ?`,a:a+b*c-d,h:'BODMAS: multiply before add/subtract.'}}],
['Square Roots & Cube Roots',()=>{const n=R(11,40),c=R(2,15);return R(0,1)?{q:`√${n*n} = ?`,a:n}:{q:`∛${c**3} = ?`,a:c}}],
['Average',()=>{const m=R(20,80),d=[R(1,9),R(1,9)],v=[m-d[0],m+d[0],m-d[1],m+d[1],m];v.sort(()=>Math.random()-.5);return{q:`Average of ${v.join(', ')}?`,a:m}}],
['Problems on Numbers',()=>{const x=R(20,90),y=R(5,x-1);return{q:`Sum of two numbers is ${x+y}, difference is ${x-y}. Larger number?`,a:x,h:'Larger = (sum + difference) / 2'}}],
['Problems on Ages',()=>{const b=R(5,40),k=R(2,20);return{q:`A is ${k} years older than B. Sum of their ages is ${2*b+k}. A's age?`,a:b+k}}],
['Surds & Indices',()=>{const a=R(2,9),b=R(2,9),c=R(1,9);return{q:`2^${a} × 2^${b} ÷ 2^${c} = 2^?`,a:a+b-c,h:'Add powers when multiplying, subtract when dividing.'}}],
['Percentage',()=>{const p=P([5,10,12,15,20,25,30,40,75]),n=R(2,40)*20;return{q:`${p}% of ${n} = ?`,a:p*n/100}}],
['Profit & Loss',()=>{const cp=R(2,50)*20,p=P([5,10,15,20,25]);return R(0,1)?{q:`CP = ₹${cp}, profit ${p}%. SP?`,a:cp*(100+p)/100}:{q:`CP = ₹${cp}, loss ${p}%. SP?`,a:cp*(100-p)/100,h:'SP = CP × (100 ± %)/100'}}],
['Ratio & Proportion',()=>{const a=R(1,7),b=R(1,7),k=R(5,50);return{q:`Divide ₹${(a+b)*k} in ratio ${a}:${b}. First share?`,a:a*k}}],
['Partnership',()=>{const x=R(2,9)*1000,y=R(2,9)*1000,m1=R(3,12),m2=R(3,12),s=x*m1+y*m2,g=G(x*m1,s),k=R(1,5);return{q:`A invests ₹${x} for ${m1} months, B invests ₹${y} for ${m2} months. Profit ₹${k*s/g}. A's share?`,a:k*x*m1/g,h:'Share ∝ capital × time'}}],
['Chain Rule',()=>{const a=R(2,20),n=R(2,12),t=a*n,ds=[...Array(t)].map((_,i)=>i+1).filter(x=>t%x==0&&x!=n&&x!=t),m=P(ds.length?ds:[1]);return{q:`${m} men finish a job in ${t/m} days. How many days for ${n} men?`,a,h:'Men × days is constant.'}}],
['Time & Work',()=>{const[a,b,c]=P([[12,24,8],[10,15,6],[20,30,12],[6,12,4],[12,4,3],[18,9,6],[30,20,12]]);return{q:`A finishes a work in ${a} days, B in ${b} days. Together?`,a:c,h:'Together = ab/(a+b)'}}],
['Pipes & Cisterns',()=>{const[a,b,c]=P([[3,6,6],[4,12,6],[6,12,12],[10,15,30],[12,20,30],[8,24,12]]);return{q:`Pipe A fills a tank in ${a} h, pipe B empties it in ${b} h. Both open: hours to fill?`,a:c,h:'Net = ab/(b−a)'}}],
['Time & Distance',()=>{const k=R(1,8);return R(0,1)?{q:`${18*k} km/h = ? m/s`,a:5*k,h:'× 5/18'}:{q:`Speed ${k*10} km/h for ${k+1} hours. Distance (km)?`,a:k*10*(k+1)}}],
['Problems on Trains',()=>{const v=P([36,54,72,90,108]),t=R(5,20),s=v*5/18;return{q:`A train at ${v} km/h crosses a pole in ${t} s. Length (m)?`,a:s*t}}],
['Boats & Streams',()=>{const b=R(6,20),s=R(1,5);return R(0,1)?{q:`Downstream ${b+s} km/h, upstream ${b-s} km/h. Boat speed in still water?`,a:b}:{q:`Downstream ${b+s} km/h, upstream ${b-s} km/h. Stream speed?`,a:s,h:'Stream = (down − up)/2'}}],
['Alligation or Mixture',()=>{const a=R(10,30),c=a+R(5,20),m=R(a+1,c-1);const ans=frac(c-m,m-a).replace('/',':');return{q:`Rice at ₹${a}/kg and ₹${c}/kg mixed to get ₹${m}/kg. Ratio (cheap:dear)?`,a:ans.includes(':')?ans:ans+':1',str:1,h:'(dear − mean):(mean − cheap)'}}],
['Simple Interest',()=>{const p=R(2,50)*100,r=R(2,15),t=R(1,5);return{q:`SI on ₹${p} at ${r}% p.a. for ${t} years?`,a:p*r*t/100}}],
['Compound Interest',()=>{const p=R(10,100)*100,r=P([10,20]);return{q:`CI on ₹${p} at ${r}% p.a. for 2 years?`,a:Math.round(p*((1+r/100)**2-1)),h:'P[(1+R/100)^n − 1]'}}],
['Logarithms',()=>{const b=P([2,3,5,10]),k=R(1,b==2?10:4);return{q:`log${b}(${b**k}) = ?`,a:k}}],
['Area',()=>{const l=R(5,40),b=R(3,30),r=R(1,5)*7;return R(0,1)?{q:`Rectangle ${l} m × ${b} m. Area (m²)?`,a:l*b}:{q:`Circle radius ${r} cm. Area (cm², π=22/7)?`,a:22*r*r/7}}],
['Volume & Surface Areas',()=>{const a=R(2,15);return R(0,1)?{q:`Cube edge ${a} cm. Volume?`,a:a**3}:{q:`Cube edge ${a} cm. Total surface area?`,a:6*a*a}}],
['Races & Games of Skill',()=>{const b=R(5,9),a=b+R(1,3),L=a*R(5,20)*10/G(a,10);return{q:`Speeds of A:B = ${a}:${b}. In a ${L} m race, A wins by how many metres?`,a:L*(a-b)/a}}],
['Calendar',()=>{const d=new Date(R(1950,2030),R(0,11),R(1,28)),a=DAYS[d.getDay()];return{q:`Day of the week on ${d.toDateString().slice(4)}?`,a,opts:[...new Set([a,...DAYS.filter(x=>x!=a).sort(()=>Math.random()-.5).slice(0,3)])],h:'Count odd days.'}}],
['Clocks',()=>{const h=R(1,12),m=R(0,29)*2;let a=Math.abs(30*h-5.5*m);a=Math.min(a,360-a);return{q:`Angle between the hands at ${h}:${String(m).padStart(2,'0')}?`,a,h:'|30H − 5.5M|'}}],
['Stocks & Shares',()=>{const p=P([80,90,96,110,120,125]),r=P([4,5,6,8,10]),x=p*R(5,50)*10;return{q:`Annual income from investing ₹${x} in ${r}% stock at ₹${p}?`,a:x*r/p,h:'Income = investment × rate / price'}}],
['Permutations & Combinations',()=>{const n=R(4,9),r=R(2,Math.min(4,n));return R(0,1)?{q:`${n}P${r} = ?`,a:fact(n)/fact(n-r)}:{q:`${n}C${r} = ?`,a:fact(n)/fact(r)/fact(n-r)}}],
['Probability',()=>{if(R(0,1)){const s=R(2,12),w=6-Math.abs(7-s);return{q:`Two dice are thrown. P(sum = ${s})?`,a:frac(w,36),str:1}}const n=R(2,4),k=R(0,n);return{q:`${n} coins tossed. P(exactly ${k} heads)?`,a:frac(fact(n)/fact(k)/fact(n-k),2**n),str:1}}],
['True Discount',()=>{const pw=R(5,50)*100,r=P([5,10,12,15]),t=P([1,2]);return{q:`Present worth ₹${pw}, ${r}% p.a., ${t} yr. True discount?`,a:pw*r*t/100,h:'TD = SI on present worth'}}],
['Banker\'s Discount',()=>{const a=R(5,50)*100,r=P([5,10,12,15]),t=P([1,2]);return{q:`Bill of ₹${a} due in ${t} yr at ${r}%. Banker's discount?`,a:a*r*t/100,h:'BD = SI on face value'}}],
['Heights & Distances',()=>{const d=R(5,50)*2;const k=R(0,2);if(k==0)return{q:`Angle of elevation of a tower top is 45° from ${d} m away. Height (m)?`,a:d};if(k==1)return{q:`Angle of elevation is 60° from ${d} m away. Height?`,a:`${d}√3`,opts:[`${d}√3`,`${d}/√3`,`${2*d}`,`${d}√2`],str:1};return{q:`Angle of elevation is 30° from ${d}√3 m away. Height (m)?`,a:d}}],
['Odd Man Out & Series',()=>{const a=R(1,9);if(R(0,1)){const d=R(2,9),s=[0,1,2,3,4].map(i=>a+i*d);return{q:`Next term: ${s.join(', ')}, ?`,a:a+5*d}}const r=R(2,3),s=[0,1,2,3].map(i=>a*r**i);return{q:`Next term: ${s.join(', ')}, ?`,a:a*r**4}}],
['Tabulation',()=>{const v=YRS.map(()=>R(10,90)*10);return{v:`<table><tr><th>Year</th>${YRS.map(y=>`<th>${y}</th>`).join('')}</tr><tr><th>Sales (₹ lakh)</th>${v.map(x=>`<td>${x}</td>`).join('')}</tr></table>`,...diQ(v)}}],
['Bar Graphs',()=>{const v=YRS.map(()=>R(10,90)*10);return{v:bars(YRS,v,'Production (tonnes)'),...diQ(v)}}],
['Pie Charts',()=>{const c=['Food','Rent','Travel','Education','Others'],p=[R(15,30),R(15,25),R(5,15),R(10,20)];p.push(100-p.reduce((a,b)=>a+b));const tot=R(2,10)*10000,i=R(0,4);let o=0;const arcs=p.map((x,j)=>{const a0=o/100*2*Math.PI,a1=(o+=x)/100*2*Math.PI,L=x>50?1:0;return`<path d="M80,80 L${80+70*Math.sin(a0)},${80-70*Math.cos(a0)} A70,70 0 ${L} 1 ${80+70*Math.sin(a1)},${80-70*Math.cos(a1)}Z" fill="hsl(${j*70},55%,55%)"/>`}).join('');return{v:`<svg viewBox="0 0 320 160">${arcs}${c.map((n,j)=>`<rect x="170" y="${15+j*25}" width="12" height="12" fill="hsl(${j*70},55%,55%)"/><text x="188" y="${26+j*25}" font-size="12" fill="currentColor">${n} ${p[j]}%</text>`).join('')}</svg>`,q:`Monthly spend is ₹${tot}. Amount on ${c[i]}?`,a:tot*p[i]/100}}],
['Line Graphs',()=>{const v=YRS.map(()=>R(10,90)*10);return{v:line(YRS,v,'Exports (₹ crore)'),...diQ(v)}}]
];
// ---- question banks: [question, correct, wrong, wrong, wrong] ----
const QB=arr=>()=>{const x=P(arr);return{q:x[0],a:x[1],opts:x.slice(1)}};
const MIX=ids=>()=>{const i=P(ids);return{...T[i][1](),sub:T[i][0]}};

const NOTES={
A0:'#Types of numbers|Natural numbers 1, 2, 3, …; whole numbers 0, 1, 2, …; integers include negatives; a rational number can be written p/q (q ≠ 0).|A prime has exactly two factors. 2 is the only even prime; 1 is neither prime nor composite; there are 25 primes below 100.|To test whether n is prime, divide it by the primes up to √n.#Divisibility rules|2: last digit even. 5: ends in 0 or 5. 10: ends in 0.|3 or 9: the digit sum is divisible by 3 or 9.|4: last two digits divisible by 4. 8: last three digits divisible by 8.|6: divisible by both 2 and 3. 12: by both 3 and 4.|11: (sum of digits in odd places − sum in even places) is 0 or a multiple of 11.#Unit digit of powers|0, 1, 5, 6: always the same unit digit.|4 and 9 repeat every 2: 4, 6 and 9, 1.|2, 3, 7, 8 repeat every 4: divide the power by 4 and use the remainder (use 4 when the remainder is 0).#Useful results|1 + 2 + … + n = n(n+1)/2; 1² + … + n² = n(n+1)(2n+1)/6; 1³ + … + n³ = [n(n+1)/2]².|Dividend = divisor × quotient + remainder.|aⁿ − bⁿ is always divisible by (a − b), and by (a + b) when n is even.#Worked examples|Unit digit of 7⁹⁵: 95 ÷ 4 leaves 3, and 7³ = 343, so the unit digit is 3.|Is 5,93,868 divisible by 11? From the right, odd places 8 + 8 + 9 = 25 and even places 6 + 3 + 5 = 14; 25 − 14 = 11, so yes.#Exam tips|Remainder of a product: take each factor\'s remainder, multiply, then take the remainder again.|Use the divisibility rules to rule out options quickly.',
A1:'#Meaning|HCF (highest common factor) is the largest number that divides all the given numbers.|LCM (least common multiple) is the smallest number that all the given numbers divide.#Methods|Prime factors: 36 = 2² × 3² and 84 = 2² × 3 × 7. HCF takes the lowest powers of the common primes, 2² × 3 = 12. LCM takes the highest powers of all primes, 2² × 3² × 7 = 252.|Division method for HCF: divide the larger by the smaller, then the divisor by the remainder, until the remainder is 0. The last divisor is the HCF.#Formulas|For two numbers, HCF × LCM = product of the numbers.|Co-prime numbers have HCF 1, so their LCM is their product.|HCF of fractions = HCF of numerators / LCM of denominators.|LCM of fractions = LCM of numerators / HCF of denominators.#Standard question types|Greatest number that divides x, y, z leaving remainders a, b, c = HCF(x − a, y − b, z − c).|Greatest number that leaves the same remainder in each case = HCF of the differences.|Least number that leaves remainder r when divided by x, y, z = LCM(x, y, z) + r.|Bells ringing together, or runners meeting at the start again = LCM of the time intervals.#Worked examples|Bells toll every 6, 8 and 12 minutes. They toll together again after LCM = 24 minutes.|Greatest number that divides 43, 91 and 183 leaving the same remainder: the differences are 48, 92 and 140, and their HCF is 4.#Exam tips|The HCF always divides the LCM.|The HCF can\'t exceed the smallest number, and the LCM can\'t be less than the largest.',
A2:'#Meaning|A decimal fraction has a power of 10 as its denominator: 0.7 = 7/10, 0.07 = 7/100.#Operations|Add or subtract: line up the decimal points.|Multiply: ignore the points, multiply, then give the answer as many decimal places as both numbers have together (0.3 × 0.02 = 0.006).|Divide: multiply both numbers by the same power of 10 to make the divisor whole (1.25 ÷ 0.05 = 125 ÷ 5 = 25).#Recurring decimals|Pure recurring: 0.333… = 3/9 = 1/3; 0.4545… = 45/99 = 5/11.|Mixed recurring: 0.1666… = (16 − 1)/90 = 15/90 = 1/6.#Comparing fractions|Convert them to decimals, or cross-multiply: 3/7 vs 5/11 → 33 vs 35, so 5/11 is larger.#Worked example|(0.2 × 0.02 × 0.002) / (0.4 × 0.04 × 0.004): the decimal places cancel, leaving (2 × 2 × 2)/(4 × 4 × 4) = 8/64 = 0.125.#Exam tips|Most mistakes are a misplaced decimal point, so count the places carefully.|Learn these: 1/8 = 0.125, 3/8 = 0.375, 5/8 = 0.625, 1/16 = 0.0625.',
A3:'#Order of operations (VBODMAS)|Vinculum (bar), then Brackets ( ), { }, [ ], then Of, Division, Multiplication, Addition, Subtraction.|"Of" means multiply, and it is done before division.#Identities|(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; a² − b² = (a + b)(a − b).|(a + b)³ = a³ + b³ + 3ab(a + b).|a³ + b³ = (a + b)(a² − ab + b²); a³ − b³ = (a − b)(a² + ab + b²).|If a + b + c = 0, then a³ + b³ + c³ = 3abc.#Worked examples|36 − 12 ÷ 4 × 3 + 2 = 36 − 3 × 3 + 2 = 36 − 9 + 2 = 29.|(87² − 13²)/(87 − 13) = 87 + 13 = 100.#Exam tips|Look for an identity before multiplying large numbers.|Use unit digits or digit sums to rule out options.|When the options are far apart, round the numbers and estimate.',
A4:'#Meaning|The square root of x is the number that, multiplied by itself, gives x. The cube root multiplies three times.#Methods|Prime factors: 1764 = 2² × 3² × 7², so √1764 = 2 × 3 × 7 = 42. 3375 = 3³ × 5³, so ∛3375 = 15.|Use long division for large or non-perfect squares.#Facts|A perfect square ends only in 0, 1, 4, 5, 6 or 9 (never 2, 3, 7 or 8).|√(ab) = √a × √b and √(a/b) = √a/√b. √0.09 = 0.3: the root has half the decimal places.|Unit digit of a cube and its root: 0, 1, 4, 5, 6, 9 stay the same; 2 ↔ 8 and 3 ↔ 7 swap.#Worked example|∛17576: the cube ends in 6, so the root ends in 6. Drop the last three digits to get 17; 2³ = 8 ≤ 17 < 27 = 3³, so the tens digit is 2. The root is 26.#Exam tips|Learn the squares up to 30 and the cubes up to 15.|√2 ≈ 1.414, √3 ≈ 1.732, √5 ≈ 2.236.',
A5:'#Meaning|Average = sum of the values ÷ number of values. So sum = average × count.#Key results|If every value goes up by k, the average goes up by k; if every value is multiplied by k, so is the average.|Average of consecutive numbers = (first + last)/2.|First n natural numbers: (n + 1)/2. First n even numbers: n + 1. First n odd numbers: n.|Combined average of two groups = (n₁a₁ + n₂a₂)/(n₁ + n₂).|Average speed over equal distances = 2xy/(x + y), not (x + y)/2.#Worked examples|The average of 5 numbers is 20. One is removed and the new average is 18. The removed number = 5 × 20 − 4 × 18 = 100 − 72 = 28.|A batsman averages 40 over 10 innings. To make it 42 he needs 11 × 42 − 10 × 40 = 462 − 400 = 62 runs in the 11th innings.#Exam tips|Turn averages into totals first.|Replacement: new person = old person + count × change in average.',
A6:'#Approach|Call the unknown x and turn each sentence into an equation.|"x more than y" → y + x; "x times" → multiply; "sum" → add; "product" → multiply; "reciprocal of x" → 1/x.#Standard forms|Sum S and difference D: larger = (S + D)/2, smaller = (S − D)/2.|Sum S and product P: the numbers are the roots of t² − St + P = 0.|(a + b)² − (a − b)² = 4ab.|A two-digit number is 10a + b; reversed it is 10b + a. Their sum is 11(a + b) and their difference is 9(a − b).|Three consecutive integers: x − 1, x, x + 1.#Worked examples|A two-digit number is 4 times the sum of its digits, and the digits differ by 2. 10a + b = 4(a + b) gives 6a = 3b, so b = 2a. With b − a = 2, a = 2 and b = 4: the number is 24.|A number plus its reciprocal is 10/3: the number is 3, since 3 + 1/3 = 10/3.#Exam tips|Putting each option into the condition is often faster than solving.',
A7:'#Approach|Write present ages as x and y, or as ax and bx from a ratio.|"n years ago": subtract n from every age. "After n years": add n to every age.|The difference between two people\'s ages never changes.#Formula|If the ratio is a:b now and c:d after n years: (ax + n)/(bx + n) = c/d.#Worked example|A and B\'s ages are in the ratio 4:3; after 6 years it will be 11:9. (4x + 6)/(3x + 6) = 11/9 → 36x + 54 = 33x + 66 → x = 4. The ages are 16 and 12; check: 22/18 = 11/9.#Exam tips|Ages are usually whole numbers, so reject fractional answers.|Testing the options is often quickest.',
A8:'#Meaning|An index (power) aⁿ means a × a × … (n times). A surd is an irrational root, such as √2 or ∛5.#Laws of indices|aᵐ × aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ.|(ab)ⁿ = aⁿbⁿ; (a/b)ⁿ = aⁿ/bⁿ.|a⁰ = 1; a⁻ⁿ = 1/aⁿ; a^(m/n) = ⁿ√(aᵐ).#Surds|√a × √b = √(ab); √a ÷ √b = √(a/b).|Only like surds add: 2√3 + 5√3 = 7√3.|Rationalise: 1/(√5 + √3) × (√5 − √3)/(√5 − √3) = (√5 − √3)/2.|To compare ∛4 and √3, raise both to the 6th power: 4² = 16 and 3³ = 27, so √3 is larger.#Worked examples|27^(2/3) = (∛27)² = 3² = 9.|2^(x+1) = 32 = 2⁵, so x + 1 = 5 and x = 4.#Exam tips|Write every term with the same base (4 = 2², 8 = 2³, 27 = 3³), then equate the powers.',
A9:'#Meaning|Percent means per hundred: x% = x/100.#Formulas|x% of N = xN/100. A as a percentage of B = A/B × 100.|% change = change ÷ original × 100.|If the price rises r%, cut consumption by r/(100 + r) × 100 % to keep spending the same. If it falls r%, consumption can rise by r/(100 − r) × 100 %.|Successive changes a% and b%: net change = a + b + ab/100 (use minus signs for decreases).|Population P growing r% a year becomes P(1 + r/100)ⁿ after n years.#Fractions as percentages|1/2 = 50%, 1/3 = 33⅓%, 1/4 = 25%, 1/5 = 20%, 1/6 = 16⅔%, 1/7 ≈ 14.28%, 1/8 = 12.5%, 1/9 ≈ 11.11%, 1/11 ≈ 9.09%, 1/12 = 8⅓%.#Worked examples|A salary rises 20% and then falls 20%: net = 20 − 20 − 400/100 = −4%, a 4% fall.|Sugar costs 25% more: cut consumption by 25/125 × 100 = 20%.#Exam tips|When the original is unknown, take it as 100.|Elections: remove invalid votes first; winner − loser = margin.',
A10:'#Terms|CP = cost price, SP = selling price, MP = marked (list) price. There is a profit when SP > CP and a loss when SP < CP.#Formulas|Profit % = (SP − CP)/CP × 100. Profit and loss percentages are always on CP.|SP = CP × (100 + gain%)/100; CP = SP × 100/(100 + gain%).|Discount is on MP: SP = MP × (100 − d)/100.|Successive discounts d₁ and d₂ equal a single discount of d₁ + d₂ − d₁d₂/100.|False weight: gain % = error/(true weight − error) × 100.|Two items sold at the same price, one at x% gain and one at x% loss: overall loss = x²/100 %.#Worked examples|A shopkeeper marks goods 40% above cost and gives a 20% discount: SP = 1.4 × 0.8 = 1.12 × CP, a 12% gain.|A dealer sells 900 g as 1 kg at cost price: gain = 100/900 × 100 = 11.11%.#Exam tips|When no amount is given, take CP = 100.|Discount is always on MP; profit is always on CP.',
A11:'#Meaning|A ratio a:b compares two quantities of the same kind (a/b). A proportion says two ratios are equal: a:b = c:d.#Rules|Multiplying or dividing both terms by the same number doesn\'t change a ratio.|Duplicate ratio a²:b²; sub-duplicate √a:√b; triplicate a³:b³.|In a:b :: c:d, ad = bc (product of extremes = product of means).|Fourth proportional d = bc/a. Third proportional to a and b = b²/a. Mean proportional of a and b = √(ab).|To combine A:B = 2:3 and B:C = 4:5, make B equal: A:B:C = 8:12:15.#Worked examples|₹1,200 shared among A, B and C in the ratio 2:3:5 gives ₹240, ₹360 and ₹600.|The mean proportional of 4 and 9 is √36 = 6.#Exam tips|Incomes and spending with savings: write incomes as ax, bx and spending as cy, dy, then use income − spending = saving.',
A12:'#Meaning|Partners share profit in the ratio of capital × time.#Types|Simple partnership: everyone invests for the same time, so share by capital alone.|Compound partnership: different times, so share by capital × months.|If capital changes during the year, add capital × months for each period.|A working partner may get a salary or commission first; the rest is then split.#Worked examples|A invests ₹20,000 for 12 months and B ₹30,000 for 6 months: 2,40,000 : 1,80,000 = 4:3. A profit of ₹14,000 gives A ₹8,000 and B ₹6,000.|A starts with ₹10,000 and B joins after 4 months with ₹15,000: 10,000 × 12 : 15,000 × 8 = 1:1.#Exam tips|Simplify the ratio early.|Read carefully when each partner joined or left.',
A13:'#Meaning|Chain rule links quantities that vary directly or inversely.#Direct and inverse|Direct: both rise together (more articles → more cost).|Inverse: one rises as the other falls (more men → fewer days).#Master formula|M₁ × D₁ × H₁ / W₁ = M₂ × D₂ × H₂ / W₂ (men, days, hours per day, work).#Worked examples|15 men build a wall in 8 days working 6 hours a day. 20 men working 9 hours a day need D days: 15 × 8 × 6 = 20 × D × 9, so 720 = 180D and D = 4.|12 pens cost ₹96, so 20 pens cost 96 × 20/12 = ₹160.#Exam tips|Before multiplying, mark each quantity as direct or inverse relative to the unknown.',
A14:'#Meaning|Work = rate × time. If a job takes n days, the daily rate is 1/n.#Formulas|A and B together take ab/(a + b) days. A, B and C together take 1/(1/a + 1/b + 1/c).|If A is k times as efficient as B, A takes 1/k of B\'s time.|Wages are shared in the ratio of work done.#LCM method|Take total work = LCM of the individual times; each person\'s daily units = total ÷ their own time.#Worked examples|A takes 10 days and B takes 15. Total = 30 units; A does 3 a day and B 2, so together 5 a day → 6 days.|A and B together take 12 days and A alone 20. B = 1/12 − 1/20 = 2/60 = 1/30, so B alone takes 30 days.#Exam tips|When men, women and boys are mixed, convert everyone to one unit first (for example, 1 man = 2 boys).',
A15:'#Meaning|Pipes work like time and work: inlets do positive work, outlets and leaks do negative work.#Formulas|Two inlets taking a and b hours together fill the tank in ab/(a + b) hours.|An inlet taking a hours with an outlet emptying in b hours (b > a) fills it in ab/(b − a) hours.|If a leak makes a filling time of a hours take t hours, the leak alone empties the tank in at/(t − a) hours.#Worked examples|A fills in 20 h, B fills in 30 h, C empties in 15 h. Per hour: 1/20 + 1/30 − 1/15 = (3 + 2 − 4)/60 = 1/60, so 60 hours.|A tap fills a tank in 6 h but takes 8 h because of a leak. The leak empties it in 6 × 8/(8 − 6) = 24 h.#Exam tips|Take the tank\'s capacity as the LCM of the times, in units.',
A16:'#Meaning|Distance = speed × time.#Conversions|1 km/h = 5/18 m/s; 1 m/s = 18/5 km/h (36 km/h = 10 m/s).#Key results|For the same distance, time ∝ 1/speed. For the same time, distance ∝ speed.|Average speed = total distance ÷ total time. Over equal distances at x and y, it is 2xy/(x + y).|If speed becomes a/b of normal, time becomes b/a of normal.#Worked examples|Going at 40 km/h and returning at 60 km/h: average = 2 × 40 × 60/100 = 48 km/h.|At 3/4 of his usual speed a man is 20 minutes late. His time is 4/3 of usual, so 1/3 of usual = 20 minutes and the usual time is 60 minutes.#Exam tips|Convert units first: minutes ÷ 60 = hours.',
A17:'#Meaning|When a train passes something, its own length is part of the distance.#Formulas|Passing a pole, man or post: time = train length ÷ speed.|Passing a platform or bridge of length P: time = (L + P) ÷ speed.|Two trains of lengths L₁ and L₂: opposite directions, time = (L₁ + L₂)/(v₁ + v₂); same direction, (L₁ + L₂)/(v₁ − v₂).|Passing a walking man: use the relative speed between the train and the man.#Worked examples|A 150 m train at 54 km/h (15 m/s) passes a 300 m platform in 450/15 = 30 s.|Trains of 100 m and 120 m at 50 and 40 km/h in opposite directions: relative speed 90 km/h = 25 m/s, so 220/25 = 8.8 s.#Exam tips|When lengths are in metres, always convert km/h to m/s.',
A18:'#Terms|Downstream means with the current; upstream means against it. Boat speed in still water = b; stream speed = s.#Formulas|Downstream = b + s; upstream = b − s.|b = (down + up)/2; s = (down − up)/2.|Round trip of distance d: total time = d/(b + s) + d/(b − s).#Worked examples|A boat goes 30 km downstream in 2 h and 30 km upstream in 3 h: down = 15, up = 10, so b = 12.5 km/h and s = 2.5 km/h.|A man rows at 6 km/h in still water against a 2 km/h stream; a round trip takes 3 h. d/8 + d/4 = 3 → 3d/8 = 3 → d = 8 km.#Exam tips|A raft or log floats at the stream\'s speed.',
A19:'#Meaning|Alligation finds the ratio in which two ingredients at different prices must be mixed to give a mixture at a chosen price.#Rule|Cheaper : dearer = (d − m) : (m − c), where c is the cheaper price, d the dearer price and m the mean price.|The same rule works for concentrations, speeds and averages.#Replacement|From x litres of pure liquid, take out y litres and refill with water, n times: pure liquid left = x(1 − y/x)ⁿ.#Worked examples|Tea at ₹60 and ₹65 per kg mixed to sell at ₹63: ratio = (65 − 63):(63 − 60) = 2:3.|40 L of milk; 4 L replaced with water twice: milk left = 40 × (36/40)² = 32.4 L.#Exam tips|The mean price always lies between the two prices.|If a profit is included, first find the mixture\'s cost price.',
A20:'#Meaning|Simple interest is charged only on the original principal.#Formulas|SI = PRT/100; amount A = P + SI.|P = 100 × SI/(RT); R = 100 × SI/(PT); T = 100 × SI/(PR).|If a sum becomes n times itself in T years, R = 100(n − 1)/T.#Worked examples|₹5,000 at 8% for 3 years: SI = 5000 × 8 × 3/100 = ₹1,200, so the amount is ₹6,200.|A sum doubles in 8 years, so R = 100/8 = 12.5%. It triples (SI = 2P) in 16 years.#Exam tips|Convert months to years by dividing by 12.|SI is the same every year, so it grows in a straight line.',
A21:'#Meaning|With compound interest, each period\'s interest is added to the principal, so the next interest is on the larger amount.#Formulas|A = P(1 + R/100)ⁿ and CI = A − P.|Half-yearly: A = P(1 + R/200)²ⁿ. Quarterly: A = P(1 + R/400)⁴ⁿ.|Different rates each year: A = P(1 + R₁/100)(1 + R₂/100)….|CI − SI for 2 years = P(R/100)². For 3 years = P(R/100)²(3 + R/100).#Worked examples|₹10,000 at 10% for 2 years: A = 10,000 × 1.21 = ₹12,100, so CI = ₹2,100. SI would be ₹2,000; the difference of ₹100 = 10,000 × 0.1².|CI − SI for 2 years at 5% is ₹25: P = 25/0.05² = ₹10,000.#Exam tips|Effective 2-year rates: 5% → 10.25%, 10% → 21%, 20% → 44%.|Population growth uses the same formula; depreciation uses (1 − R/100).',
A22:'#Meaning|logₐ x = n means aⁿ = x (with a > 0, a ≠ 1, x > 0).#Laws|logₐ(xy) = logₐ x + logₐ y; logₐ(x/y) = logₐ x − logₐ y.|logₐ(xⁿ) = n logₐ x; logₐ a = 1; logₐ 1 = 0.|Change of base: logₐ x = log x / log a. Also logₐ b × log_b a = 1 and a^(logₐ x) = x.#Common logs (base 10)|log 2 = 0.3010, log 3 = 0.4771, log 5 = 0.6990, log 7 = 0.8451.|Characteristic: a number with n digits before the decimal point has characteristic n − 1.#Worked examples|log₂ 64 = 6, because 2⁶ = 64.|log 25 = 2 log 5 = 1.3980.|Digits in 2⁵⁰: 50 × 0.3010 = 15.05, so 2⁵⁰ has 16 digits.#Exam tips|Put everything in one base before simplifying.',
A23:'#Rectangle and square|Rectangle: area lb; perimeter 2(l + b); diagonal √(l² + b²).|Square: area a² (or d²/2 from the diagonal); perimeter 4a; diagonal a√2.#Triangle|Area = ½ × base × height.|Heron: s = (a + b + c)/2, area = √(s(s − a)(s − b)(s − c)).|Equilateral: area (√3/4)a², height (√3/2)a. Right triangle: ½ × product of the two legs.#Other quadrilaterals|Parallelogram: base × height. Rhombus: ½ × d₁ × d₂. Trapezium: ½ × (sum of parallel sides) × height.#Circle|Area πr²; circumference 2πr; semicircle perimeter πr + 2r.|Sector area (θ/360)πr²; arc length (θ/360) × 2πr.|Path of width w outside a rectangle: (l + 2w)(b + 2w) − lb.#Worked examples|Triangle with sides 13, 14, 15: s = 21, area = √(21 × 8 × 7 × 6) = √7056 = 84.|A wheel of radius 35 cm has circumference 2 × 22/7 × 35 = 220 cm, so it turns 1,10,000/220 = 500 times in 1.1 km.#Exam tips|If every side grows by x%, area grows by 2x + x²/100 %.',
A24:'#Cuboid and cube|Cuboid: volume lbh; total surface 2(lb + bh + lh); diagonal √(l² + b² + h²).|Cube: volume a³; total surface 6a²; diagonal a√3.#Cylinder and cone|Cylinder: volume πr²h; curved surface 2πrh; total surface 2πr(r + h).|Cone: volume ⅓πr²h; slant height l = √(r² + h²); curved surface πrl; total surface πr(l + r).#Sphere and hemisphere|Sphere: volume (4/3)πr³; surface 4πr².|Hemisphere: volume (2/3)πr³; curved surface 2πr²; total surface 3πr².#Prism and pyramid|Prism: base area × height. Pyramid: ⅓ × base area × height.#Worked examples|Cylinder with r = 7 cm and h = 10 cm: V = 22/7 × 49 × 10 = 1540 cm³.|A sphere of radius 6 cm is melted into a cylinder of radius 4 cm: (4/3)π × 216 = π × 16 × h, so h = 18 cm.#Exam tips|1 m³ = 1000 litres.|When an object is melted and recast, its volume stays the same.',
A25:'#Terms|"A beats B by x m": when A finishes, B is x m behind.|"A beats B by t seconds": B finishes t seconds after A.|"A gives B a start of x m": B starts x m ahead.|Dead heat: both finish together.#Method|In the same time, distances are in the ratio of speeds.|If A beats B by x m or by t seconds, B covers x m in t seconds, so B\'s speed = x/t.#Games of skill|"A can give B 20 points in 100" means that when A scores 100, B scores 80.#Worked examples|In a 1 km race A beats B by 40 m or by 8 s. B\'s speed = 40/8 = 5 m/s, so B takes 200 s and A takes 192 s.|A and B\'s speeds are 5:4 in a 100 m race. When A runs 100 m, B runs 80 m, so A wins by 20 m.#Exam tips|Turn every statement into "distance each covers when the winner finishes".',
A26:'#Odd days|Odd days are the days left over after complete weeks.|An ordinary year (365 days) has 1 odd day; a leap year (366) has 2.|100 years have 5 odd days, 200 years 3, 300 years 1 and 400 years 0.#Leap years|A year divisible by 4 is a leap year, but a century year must be divisible by 400 (2000 was a leap year; 1900 was not).#Day codes|0 = Sunday, 1 = Monday, 2 = Tuesday, 3 = Wednesday, 4 = Thursday, 5 = Friday, 6 = Saturday.|Odd days per month: Jan 3, Feb 0 (1 in a leap year), Mar 3, Apr 2, May 3, Jun 2, Jul 3, Aug 3, Sep 2, Oct 3, Nov 2, Dec 3.#Worked example|15 August 1947. 1600 years → 0 odd days; 300 years → 1; 1901–1946 (11 leap + 35 ordinary years) → 57 → 1; Jan–Jul 1947 → 16 → 2; 15 days → 1. Total 5 → Friday.#Exam tips|A date falls one weekday later the next year, or two later if a 29 February comes in between.',
A27:'#Basics|The dial is 360°, split into 60 minute spaces of 6° each.|The minute hand moves 6° a minute and the hour hand 0.5° a minute, so the minute hand gains 5.5° a minute.#Formulas|Angle at H:M = 30H − 5.5M, ignoring the sign. If it is over 180°, use 360° minus it.|In 12 hours the hands meet 11 times, point in opposite directions 11 times, and are at right angles 22 times.|The hands meet every 65 5/11 minutes.|Between H and H + 1 o\'clock, the hands meet at 5H × 12/11 minutes past H.#Worked examples|At 3:40 the angle is 220 − 90 = 130°.|Between 4 and 5 the hands meet at 20 × 12/11 = 21 9/11 minutes past 4.#Faulty clocks|In a correct clock the hands meet every 65 5/11 minutes. If they meet sooner, the clock is gaining; if later, it is losing.#Exam tips|Mirror-image time = 11:60 − the actual time.',
A28:'#Terms|Face value (FV): the fixed value of a share, usually ₹100. Dividend is paid on the face value.|Market value (MV): the price on the market. At par MV = FV; at a premium MV > FV; at a discount MV < FV.|Brokerage adds to the cost when buying and is taken off when selling.|"r% stock at ₹p" means each ₹100 of face value pays ₹r a year and costs ₹p.#Formulas|Number of shares = investment ÷ MV.|Annual income = number of shares × r = investment × r ÷ MV (with FV ₹100).|Yield = r/MV × 100 %.#Worked examples|₹9,600 invested in 8% stock at ₹96 buys 100 shares and earns ₹800 a year, a yield of 8/96 × 100 = 8.33%.|Which is better, 6% stock at 90 or 8% at 125? 6/90 = 6.67% and 8/125 = 6.4%, so the first.#Exam tips|The dividend never depends on the market value.|Brokerage changes the effective market value.',
A29:'#Counting principles|AND (both happen) → multiply. OR (either happens) → add.#Permutations (order matters)|nPr = n!/(n − r)!. n distinct objects can be arranged in n! ways.|With repeated items (p alike, q alike): n!/(p! q!).|Round a table: (n − 1)!. Necklace or garland (can be flipped): (n − 1)!/2.#Combinations (order doesn\'t matter)|nCr = n!/(r!(n − r)!); nC0 = nCn = 1; nCr = nC(n − r).|Ways to choose at least one of n things = 2ⁿ − 1.|Handshakes among n people = nC2. Diagonals of an n-sided polygon = nC2 − n.#Worked examples|LEADER: 6!/2! = 360 arrangements (E appears twice).|BANANA: 6!/(3! 2!) = 60 arrangements.|A committee of 3 men from 6 and 2 women from 5: 6C3 × 5C2 = 20 × 10 = 200.#Exam tips|Items that must stay together: treat the group as one item, then arrange inside the group.|"Never together" = total arrangements − arrangements together.',
A30:'#Meaning|P(E) = favourable outcomes ÷ total equally likely outcomes. 0 ≤ P ≤ 1; certain = 1; impossible = 0.#Rules|P(not E) = 1 − P(E).|P(A or B) = P(A) + P(B) − P(A and B). If A and B can\'t happen together, P(A or B) = P(A) + P(B).|Independent events: P(A and B) = P(A) × P(B).|Odds in favour a:b means P = a/(a + b).#Sample spaces|n coins: 2ⁿ outcomes. One die: 6; two dice: 36.|Cards: 52 in 4 suits of 13 (spades and clubs are black, hearts and diamonds red); 4 aces; 12 face cards (J, Q, K).|Ways to get each sum with two dice, from 2 to 12: 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1.#Worked examples|Two dice: P(sum 8) = 5/36.|One card: P(king or heart) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13.|3 red and 5 blue balls; draw two: P(both red) = 3C2/8C2 = 3/28.#Exam tips|P(at least one) = 1 − P(none).',
A31:'#Meaning|An amount A due after T years at R% is worth less today. Its present worth (PW) is the sum that grows to A with simple interest.|True discount (TD) = A − PW, which is the simple interest on PW.#Formulas|PW = 100A/(100 + RT).|TD = ART/(100 + RT) = PW × R × T/100.|A = PW + TD; also A = (SI × TD)/(SI − TD), where SI is the interest on A.#Worked examples|₹1,260 due in 1 year at 5%: PW = 1,26,000/105 = ₹1,200, so TD = ₹60.|TD on a sum due in 2 years at 10% is ₹100: 100 = PW × 20/100, so PW = ₹500 and A = ₹600.#Exam tips|TD is interest on the present worth, not on the amount.',
A32:'#Meaning|When a bank buys a bill before it is due, it deducts the banker\'s discount (BD): simple interest on the face value for the time left.|Banker\'s gain (BG) = BD − TD, which is the simple interest on TD.#Formulas|BD = A × R × T/100. TD = ART/(100 + RT).|BG = TD²/PW. A = BD × TD/(BD − TD).|Legally due date = nominal due date + 3 days of grace.#Worked examples|A ₹6,000 bill due in 6 months at 10%: BD = 6000 × 10 × 0.5/100 = ₹300; TD = 6000 × 5/105 ≈ ₹285.71; BG ≈ ₹14.29.|BD = ₹120 and TD = ₹100: A = 120 × 100/20 = ₹600.#Exam tips|BD is always larger than TD; the difference (BG) is interest on TD.',
A33:'#Ratios|sin = opposite/hypotenuse; cos = adjacent/hypotenuse; tan = opposite/adjacent.|tan 30° = 1/√3, tan 45° = 1, tan 60° = √3. sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2.#Angles|Angle of elevation: from the horizontal, looking up at the object.|Angle of depression: from the horizontal, looking down. It equals the angle of elevation from the other point (alternate angles).#Worked examples|From 40 m away the top of a tower is at 60°: height = 40 tan 60° = 40√3 ≈ 69.3 m.|A pole\'s shadow is √3 times its height: tan θ = 1/√3, so the sun is at 30°.|The elevation changes from 30° to 60° as you walk 20 m towards a tower. With x = distance from the nearer point: h = x√3 and h = (x + 20)/√3, so x = 10 m and h = 10√3 m.#Exam tips|Draw the right triangle first. √3 ≈ 1.732.',
A34:'#Number series patterns|Arithmetic: a constant difference (3, 7, 11, 15: +4).|Geometric: a constant ratio (2, 6, 18, 54: ×3).|Second differences: 1, 2, 5, 10, 17 has differences 1, 3, 5, 7.|Squares or cubes ± a constant: 2, 5, 10, 17 = n² + 1.|Mixed rules (×2 + 1), two alternating series, or primes (2, 3, 5, 7, 11).#Odd one out|Find the property every item shares except one: prime or composite, even or odd, perfect square, digit sum, divisibility.#Worked examples|4, 6, 12, 14, 28, 30, ?: alternately +2 and ×2, so the answer is 60.|25, 36, 48, 64: 48 is the odd one out (not a perfect square).#Exam tips|Try differences first, then ratios, then squares and cubes, then alternate terms.',
A35:'#Approach|Read the title, row and column headings, and units (lakh, crore, %) first. Note any totals or base year.#Common calculations|% change = (new − old)/old × 100.|Share of total = part/total × 100.|Average = sum ÷ count; reduce ratios to the simplest form.#Worked examples|Sales rise from 400 to 500: change = 100/400 × 100 = 25%.|A share of 350 out of 2,000 is 17.5%.#Exam tips|Round numbers (487 ≈ 490) when the options are far apart.|Reuse values you have already worked out across a set of questions.',
A36:'#Reading|A bar\'s height or length shows its value against the scale.|Grouped bars compare categories side by side; stacked bars show parts of a total.#Typical questions|Highest or lowest, increase, % change, ratio, and average across bars.#Worked example|Bars of 300, 450 and 600: the % rise is 150/300 = 50% from the first to the second, but only 33.3% from the second to the third. The rises are equal in size but not in percentage.#Exam tips|Check whether the scale starts at 0, and read the gridlines carefully.',
A37:'#Reading|The whole circle is 100%, or 360°. Each sector shows a share of the total.#Formulas|Value = sector% × total/100.|Angle = sector% × 3.6; sector% = angle ÷ 3.6.|The ratio of two items equals the ratio of their percentages, so you don\'t need the total.#Worked examples|Budget ₹50,000 with rent at 25%: rent is ₹12,500 and its angle is 90°.|A 72° sector is 20% of the total.#Exam tips|When two pie charts have different totals, compare actual amounts, not percentages.',
A38:'#Reading|Points joined over time show the trend. The slope shows how fast the value changes.#Typical questions|Biggest rise or fall (the steepest segment), years above the average, % change, and combined values of two lines.#Worked example|Exports go 200 → 260 → 240: a 30% rise, then a 7.7% fall.#Exam tips|Absolute change isn\'t the same as percentage change: a steep rise from a small base can be a large percentage.',
J0:'#Growth and development|Growth is quantitative (height, weight). Development is qualitative and continuous.|Principles: head to toe (cephalocaudal), centre outwards (proximodistal), general to specific, individual differences, and heredity interacting with environment.#Piaget (cognitive development)|Sensorimotor (0–2): object permanence.|Preoperational (2–7): symbolic play, egocentrism, animism, no conservation.|Concrete operational (7–11): conservation, reversibility, classification.|Formal operational (11+): abstract and hypothetical thinking.|Key terms: schema, assimilation, accommodation, equilibration.#Vygotsky (socio-cultural)|Learning happens first through social interaction, and language is a tool of thought.|Zone of Proximal Development: the gap between what a child can do alone and with help.|Scaffolding: temporary support from an adult or peer. Private speech guides a child\'s thinking.#Learning theories|Pavlov: classical conditioning (bell → salivation).|Skinner: operant conditioning, positive and negative reinforcement, shaping.|Thorndike: trial and error, with the laws of readiness, exercise and effect.|Köhler: insight learning (Gestalt).|Bandura: observational learning (attention, retention, reproduction, motivation); the Bobo doll study.#Moral development and personality|Kohlberg: pre-conventional (punishment and reward), conventional (approval, law and order), post-conventional (social contract, universal principles).|Erikson: 8 psychosocial stages, starting with trust vs mistrust. Freud: id, ego, superego.#Intelligence|Binet made the first intelligence test. IQ = mental age ÷ chronological age × 100.|Spearman: general (g) and specific (s) factors.|Gardner\'s multiple intelligences: linguistic, logical-mathematical, spatial, musical, bodily-kinaesthetic, interpersonal, intrapersonal, naturalistic.|Goleman: emotional intelligence.#Inclusion and assessment|Learning difficulties: dyslexia (reading), dysgraphia (writing), dyscalculia (maths), ADHD (attention).|RTE Act 2009: free and compulsory education for ages 6–14; 25% of seats in private schools for weaker sections; no corporal punishment.|CCE combines formative and summative assessment, scholastic and co-scholastic.|NCF 2005: learning without burden, linking school knowledge to life outside school.#Exam tips|Pick child-centred, constructivist options. Avoid options that punish, label children or rely on rote learning.',
J1:'#वर्ण|स्वर (11): अ आ इ ई उ ऊ ऋ ए ऐ ओ औ।|व्यंजन: क-वर्ग से प-वर्ग तक 25 स्पर्श; अंतःस्थ य र ल व; ऊष्म श ष स ह।#शब्द-भेद|संज्ञा (व्यक्तिवाचक, जातिवाचक, भाववाचक), सर्वनाम, विशेषण, क्रिया (सकर्मक, अकर्मक), अव्यय।#संधि|दीर्घ: विद्या + आलय = विद्यालय। गुण: देव + इंद्र = देवेंद्र। वृद्धि: सदा + एव = सदैव।|यण: इति + आदि = इत्यादि। अयादि: ने + अन = नयन।|व्यंजन संधि: जगत् + ईश = जगदीश। विसर्ग संधि: मनः + योग = मनोयोग।#समास|अव्ययीभाव: पहला पद अव्यय (यथाशक्ति)।|तत्पुरुष: दूसरा पद प्रधान (राजपुत्र)। कर्मधारय: विशेषण-विशेष्य (नीलकमल)।|द्विगु: पहला पद संख्या (चौराहा, त्रिलोक)। द्वंद्व: दोनों पद प्रधान (माता-पिता)।|बहुव्रीहि: कोई अन्य अर्थ प्रधान (नीलकंठ = शिव, लंबोदर = गणेश)।#कारक (8)|कर्ता: ने। कर्म: को। करण: से, के द्वारा। संप्रदान: को, के लिए।|अपादान: से (अलग होना)। संबंध: का, के, की। अधिकरण: में, पर। संबोधन: हे, अरे।#पर्यायवाची, विलोम, मुहावरे|कमल: पंकज, जलज, नीरज। सूर्य: दिनकर, भास्कर, रवि। जल: नीर, वारि।|विलोम: आदि–अंत, उन्नति–अवनति, दिन–रात।|आँख का तारा = बहुत प्यारा; नौ दो ग्यारह होना = भाग जाना; दाँतों तले उँगली दबाना = आश्चर्य करना।#भाषा शिक्षण|बच्चा भाषा सुनकर और बोलकर सीखता है। कौशलों का क्रम: सुनना, बोलना, पढ़ना, लिखना।|कहानी, कविता, संवाद और भाषा-समृद्ध कक्षा उपयोगी हैं।|त्रुटियाँ सीखने का स्वाभाविक हिस्सा हैं।',
J2:'#Parts of speech|Noun, pronoun, verb, adjective, adverb, preposition, conjunction, interjection.|A word\'s part of speech depends on its use: "fast" is an adjective in "a fast car" and an adverb in "runs fast".#Tenses|Simple present (habits, facts: the sun rises), present continuous (is running), present perfect (has eaten).|Simple past (ate), past continuous (was eating), past perfect (had eaten), simple future (will eat).#Grammar rules|Subject–verb agreement: a singular subject takes a singular verb (he plays). Each, every, either and neither take singular verbs.|With "neither … nor", the verb agrees with the nearer subject: "Neither the teacher nor the students were present."|Articles go by sound: an hour, an MBA, a university, a one-day match. Use "the" for specific or unique things.|Prepositions of time: in (months, years), on (days, dates), at (clock times).#Voice and narration|Active to passive: the object becomes the subject, add be + past participle, and keep the tense. writes → is written; wrote → was written; is writing → is being written; has written → has been written.|Direct to indirect: present becomes past; I → he/she; now → then; today → that day.#Vocabulary|Synonyms and antonyms; one-word substitutes (one who knows everything: omniscient); idioms (a piece of cake: very easy).#Language teaching|Krashen: comprehensible input; acquisition is different from learning.|Skills: listening, speaking, reading, writing. Approaches: communicative, whole language, task-based.|Reading combines phonics with meaning. Errors are part of learning; assess with portfolios and observation.',
J3:'#What it covers|Number system, HCF and LCM, fractions and decimals, percentage, ratio, average, profit and loss, simple interest, area and perimeter, volume.|Each question names the Aptitude chapter it comes from. Open that chapter for its full notes and formulas.#Key formulas|Percentage = part/whole × 100. SI = PRT/100. Average = sum ÷ count.|Rectangle area = lb; circle area = πr²; cube volume = a³.#Teaching mathematics|Move from concrete to pictorial to abstract, using objects such as beads and blocks.|Van Hiele levels of geometry: visualisation, analysis, informal deduction, formal deduction, rigour.|Children\'s errors reveal their misconceptions: diagnose first, then remediate.|Mathematics is about patterns and reasoning, not only calculation. Use everyday contexts such as shopping and measuring.|NCF 2005: the main goal is mathematising the child\'s thinking. Assess with open-ended questions and oral explanation.#Exam tips|For pedagogy questions, choose activity-based, child-centred options that focus on reasoning.',
J4:'#Plants|Photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, in chloroplasts, using chlorophyll and sunlight. Gases pass through stomata.|Respiration releases energy in mitochondria. Transpiration is water loss through the leaves.#Human body|Red blood cells carry oxygen using haemoglobin; white cells fight infection; platelets help blood clot.|The heart has 4 chambers. Digestion starts in the mouth (saliva contains amylase); most absorption happens in the small intestine. The liver is the largest gland.#Nutrition|Vitamin A → night blindness; B1 → beriberi; C → scurvy; D → rickets; K → poor blood clotting.|Iodine → goitre; iron → anaemia; protein → kwashiorkor.#Physics and chemistry basics|SI units: force newton (N), energy joule (J), power watt (W), pressure pascal (Pa), current ampere (A).|Light travels at 3 × 10⁸ m/s. At sea level water boils at 100 °C and freezes at 0 °C.|pH below 7 is acidic, 7 is neutral and above 7 is basic.|A physical change is usually reversible; a chemical change makes a new substance.#Environment|Renewable resources: sun, wind, water. Non-renewable: coal, petroleum.|Food chain: producer → herbivore → carnivore; decomposers recycle nutrients. Greenhouse gases warm the earth.#Teaching EVS and science|EVS in classes 3–5 links science and social studies through themes: family, food, water, shelter, travel, things we make.|Children learn by observing, exploring and experimenting in their local environment. Ask open questions.|Process skills: observe, classify, hypothesise, experiment, conclude.',
J5:'#Jharkhand|Formed on 15 November 2000 from Bihar as India\'s 28th state, on Birsa Munda\'s birth anniversary. Capital and High Court: Ranchi.|It lies on the Chotanagpur plateau; the highest peak is Parasnath (Giridih).|Rivers: Damodar ("sorrow of Bengal"), Subarnarekha, Koel, Barakar. Waterfalls: Hundru (Subarnarekha), Dassam, Jonha.|Minerals: coal (Jharia, Bokaro), iron ore (Noamundi), copper (Ghatsila), mica (Koderma), uranium (Jaduguda).|Steel: Jamshedpur (TISCO, 1907) and Bokaro.#Tribes and movements|Major tribes: Santhal (the largest), Oraon, Munda, Ho, Kharia.|Tilka Manjhi rebelled in the 1780s. Kol uprising: 1831–32.|Santhal Hul, 1855–56: led by Sidhu, Kanhu, Chand and Bhairav.|Birsa Munda\'s Ulgulan, 1899–1900; he is called "Dharti Aaba".|Tana Bhagat movement, 1914: led by Jatra Oraon.#Indian Constitution|Adopted 26 November 1949; in force 26 January 1950.|Part III: Fundamental Rights (Articles 12–35). Part IV: Directive Principles (36–51). Part IVA: Fundamental Duties (51A).|Article 21A: Right to Education. 73rd Amendment (1992): Panchayati Raj.#History and geography basics|Indus Valley sites: Harappa, Mohenjo-daro. Revolt of 1857. Independence: 15 August 1947.|India\'s standard meridian is 82½° E.#Teaching social studies|Connect lessons to children\'s lives. Use maps, sources, field trips and discussion.|Aim for critical thinking, not rote memorisation.',
U0:'#Teaching|Teaching is interaction aimed at learning.|Maxims: known to unknown, simple to complex, concrete to abstract, particular to general, whole to part.|Levels: memory (Herbart; rote and teacher-centred), understanding (Morrison; grasping principles), reflective (Hunt; problem-centred, the highest).#Learners|Adult learners are self-directed and learn from experience (andragogy, Knowles).|Learners differ in ability and style (visual, auditory, kinaesthetic).#Factors affecting teaching|The teacher (knowledge, communication), the learner (motivation, readiness), support material, institutional facilities, and the learning environment.#Methods|Teacher-centred: lecture, demonstration.|Learner-centred: discussion, project, problem-solving, case study, role-play, flipped classroom, cooperative learning.|Online: SWAYAM (MOOCs), SWAYAM Prabha (DTH channels), NPTEL, e-PG Pathshala, National Digital Library.#Bloom\'s taxonomy|Cognitive: knowledge, comprehension, application, analysis, synthesis, evaluation. Revised (2001): remember, understand, apply, analyse, evaluate, create.|Affective: from receiving up to characterisation. Psychomotor: physical skills.#Evaluation|Formative: during teaching, to improve learning. Summative: at the end, to certify.|Diagnostic: finds learning difficulties. Placement: decides the starting level.|Norm-referenced tests compare a learner with peers; criterion-referenced tests compare with a set standard.|A good test is valid, reliable, objective and usable. CBCS = Choice Based Credit System.#Exam tips|Prefer options where the learner is active and the teacher is a facilitator.',
U1:'#Meaning and types|Research is a systematic search for new knowledge.|Fundamental (builds theory), applied (solves a practical problem), action (a teacher solves a classroom problem).|Descriptive, analytical, historical, experimental, and ex post facto (studying causes after the effect has happened).|Quantitative research is positivist and objective; qualitative research is interpretive and studies meanings.#Steps|Identify the problem → review literature → form a hypothesis → design → sample → collect data → analyse → interpret → report.#Hypothesis|A testable, tentative statement. The null hypothesis H₀ says there is no difference; the alternative says there is.|Type I error: rejecting a true H₀ (α). Type II error: accepting a false H₀ (β).|Usual significance levels: 0.05 and 0.01.#Sampling|Probability: simple random, systematic, stratified, cluster, multi-stage.|Non-probability: convenience, purposive, quota, snowball.#Tools|Questionnaire, interview, observation, schedule, rating scale, Likert scale (for attitudes), case study.|Reliability means consistent results; validity means the tool measures what it is meant to.#Statistics|Parametric tests (t-test, ANOVA, Pearson\'s r) assume normal data.|Non-parametric tests (chi-square, Mann-Whitney, Spearman\'s rank) don\'t.#Writing and ethics|Thesis structure: introduction, literature review, method, results, discussion, references, appendices.|Citation styles: APA (social sciences), MLA (humanities), Chicago.|Plagiarism is unethical (UGC regulations, 2018). Shodhganga stores Indian theses; ShodhShuddhi checks for plagiarism.#Exam tips|Match the type of research to the purpose described in the question.',
U2:'#What is asked|A passage of about 300–500 words, followed by questions on the main idea, details, inferences, the author\'s tone or purpose, word meanings and a suitable title.#Strategy|Skim the questions first, then read the passage once, noting the main point of each paragraph.|Answer only from the passage, not from outside knowledge.|For the main idea or title, choose the option that covers the whole passage, not one paragraph.|For inference, choose what must be true from the text, not what might be true.|Common tones: critical, appreciative, neutral, sarcastic.#Traps|Options that are true in real life but not stated in the passage.|Extreme words such as always, never and only.|Options that reuse the passage\'s words but change its meaning.#Practice tip|Sum up each paragraph in about five words in your head as you read.',
U3:'#Meaning and process|Communication is the sharing of meaning.|Process: sender → encoding → message → channel → decoding → receiver → feedback. Noise can interrupt it at any point.|Models: Aristotle (speaker, speech, audience); Shannon–Weaver (adds noise); Berlo (SMCR: source, message, channel, receiver); Lasswell (who says what, in which channel, to whom, with what effect).#Types|Verbal communication can be oral or written.|Non-verbal: kinesics (body movement, gestures), proxemics (space), haptics (touch), chronemics (time), paralanguage (tone, pitch), oculesics (eye contact), artefacts (dress).|Levels: intrapersonal, interpersonal, group, mass.|Formal communication flows upward, downward or horizontally; informal communication is the grapevine.#Barriers|Physical (noise), semantic (language, jargon), psychological (emotion, prejudice), cultural, organisational.#Classroom communication|Effective classroom communication is two-way, clear and audible, with examples and feedback.|The teacher\'s body language and eye contact matter. Listening is an active skill.#Mass media|Print, radio, TV, the internet and social media; they inform, educate and entertain.|Marshall McLuhan: "the medium is the message" and the "global village".#Exam tips|Choose options that show interaction, empathy and feedback.',
U4:'#What it covers|Number and letter series, coding–decoding, percentage, ratio, average, profit and loss, interest, time and work, ages, time and distance.|Each question names the Aptitude chapter it comes from. Open that chapter for its full notes and formulas.#Letter series and coding|Letter positions: A = 1 … Z = 26; in reverse, Z = 1 … A = 26.|Look for a shift (+1, +2), reversal or skipped letters.#Exam tips|Work from the options and estimate when they are far apart.|Fix the shortcuts in your memory: successive % change, average speed 2xy/(x + y), together-time ab/(a + b).',
U5:'#Arguments|An argument has premises and a conclusion. Conclusion words: therefore, hence. Premise words: because, since.|Deductive: the conclusion follows necessarily (valid or invalid). Inductive: the conclusion is only probable (strong or weak).|Sound = valid with true premises.#Categorical propositions|A: All S are P. E: No S is P. I: Some S are P. O: Some S are not P.|Contradictories (A–O, E–I): exactly one is true.|Contraries (A–E): they can\'t both be true but can both be false.|Subcontraries (I–O): they can\'t both be false.|Subalternation: A implies I, and E implies O.#Syllogism|Two premises and three terms (major, minor, middle). The middle term must be distributed at least once.|Use Venn diagrams to check.#Fallacies|Ad hominem (attacking the person), begging the question (circular), hasty generalisation, false cause (post hoc), appeal to authority or popularity, straw man.#Indian logic|Pramanas: Pratyaksha (perception), Anumana (inference), Upamana (comparison), Shabda (testimony), Arthapatti (postulation), Anupalabdhi (non-apprehension).|Charvaka accepts only perception. Nyaya accepts four (perception, inference, comparison, testimony). Bhatta Mimamsa and Advaita Vedanta accept all six.|Parts of inference: paksha (subject), sadhya (what is to be proved), hetu (reason).|Five-part Nyaya syllogism: pratijna, hetu, udaharana, upanaya, nigamana. Hetvabhasa are fallacies of inference.#Worked example|"All teachers are graduates. Some graduates are poets." Nothing follows about teachers and poets, because the middle term (graduates) is not distributed.#Exam tips|Also practise analogies, classification, blood relations and directions.',
U6:'#Approach|Read the headings and units first, and note totals or the base year.#Formulas|% change = (new − old)/old × 100. Share = part/total × 100.|Pie charts: value = share% × total/100; angle = share% × 3.6°.#Exam tips|Estimate when the options are far apart, and reuse values across a set of questions.|Each question names its source chapter (Tabulation, Bar Graphs, Pie Charts or Line Graphs), which has worked examples.',
U7:'#Basics|ICT covers hardware, software and networks. The CPU contains the ALU, the control unit and registers.|Memory: primary (RAM is volatile, ROM is non-volatile, cache) and secondary (HDD, SSD, pen drive).|Input devices: keyboard, mouse, scanner, microphone. Output devices: monitor, printer, speaker.|Units: bit; nibble = 4 bits; byte = 8 bits; KB = 1024 bytes; then MB, GB, TB, PB.#Number systems|Binary (base 2), octal (8), decimal (10), hexadecimal (16).|10 = 1010 in binary; 15 = F in hex; 255 = 11111111 in binary = FF in hex.#Software|System software (operating systems: Windows, Linux, macOS, Android), application software (Word, Excel), utilities.|Open-source examples: Linux, LibreOffice. File types: .docx, .xlsx, .pptx, .pdf, .jpg.#Internet and networking|Networks: LAN, MAN, WAN. The internet is a network of networks.|IP address (IPv4 is 32-bit, IPv6 is 128-bit). DNS turns names into IP addresses.|URL; HTTP and HTTPS (secure); FTP; SMTP sends email; POP3 and IMAP receive it.|Tim Berners-Lee invented the World Wide Web (1989).|Email fields: To, CC (carbon copy), BCC (hidden copy), attachments.#Security|Threats: virus, worm, trojan, ransomware, phishing (fake messages to steal data), spam.|Protection: antivirus, firewall, strong passwords, two-factor authentication.#ICT in education and governance|SWAYAM, SWAYAM Prabha, NPTEL, e-PG Pathshala, National Digital Library (NDL), Shodhganga, Virtual Labs, National Academic Depository (NAD).|Digital India, DigiLocker, UMANG.#Exam tips|Questions often test full forms and simple number conversions.',
U8:'#Development and environment|Sustainable development (Brundtland Report, 1987): meeting present needs without harming future generations\' ability to meet theirs.|MDGs (2000–2015, 8 goals) were followed by the SDGs (2015–2030, 17 goals, 169 targets).#Pollution|Air: PM2.5, PM10, SO₂, NOₓ, CO, ozone; measured by the AQI.|Water: high BOD means polluted water; eutrophication.|Soil and noise (above about 85 dB is harmful); e-waste; plastic.|Greenhouse gases: CO₂, CH₄, N₂O, CFCs, water vapour. CFCs deplete the ozone layer.#Energy|Renewable: solar, wind, hydro, biomass, geothermal, tidal.|Non-renewable: coal, oil, natural gas, nuclear fuels.|India targets 500 GW of non-fossil capacity by 2030.#Disasters|Natural: earthquake, flood, cyclone, drought, tsunami.|Man-made: Bhopal 1984 (methyl isocyanate), Chernobyl 1986.|NDMA was set up under the Disaster Management Act 2005 and is chaired by the Prime Minister.#International agreements|Stockholm 1972: first UN environment conference; created UNEP.|Ramsar 1971: wetlands. Montreal 1987: ozone layer.|Rio Earth Summit 1992: UNFCCC, Agenda 21, Convention on Biological Diversity.|Kyoto 1997: binding greenhouse-gas cuts for developed countries.|Paris 2015: keep warming well below 2 °C, aiming for 1.5 °C, through national pledges (NDCs).|Basel: hazardous waste. Stockholm Convention: persistent organic pollutants. CITES: wildlife trade.#India|Wildlife Protection Act 1972; Forest Conservation Act 1980; Environment Protection Act 1986.|National Green Tribunal 2010. NAPCC 2008 with 8 missions, such as the National Solar Mission.|People\'s movements: Chipko (1973), Narmada Bachao, Silent Valley.',
U9:'#Ancient India|Takshashila (Gandhara, now in Pakistan); Nalanda (Bihar, 5th century CE, Gupta period); Vikramashila (Bihar, founded by Dharmapala); Vallabhi (Gujarat); Odantapuri. The gurukul system.#Colonial period|Macaulay\'s Minute (1835).|Wood\'s Despatch (1854), called the "Magna Carta of English education in India". The first universities came in 1857: Calcutta, Bombay, Madras.|Hunter Commission (1882); Sadler Commission (1917–19).#After independence|Radhakrishnan Commission (1948–49): university education; it recommended the UGC.|Mudaliar Commission (1952–53): secondary education.|Kothari Commission (1964–66): the 10+2+3 pattern; "the destiny of India is now being shaped in her classrooms".|National Policy on Education 1968 and 1986 (Programme of Action 1992); Yashpal Committee (2009); NEP 2020.#Regulatory bodies|UGC (set up 1953, statutory 1956); AICTE (technical); NCTE (teacher education); NMC (medical); BCI (law); ICAR (agriculture).|NAAC (1994) accredits institutions; NBA accredits programmes; NIRF (2015) ranks institutions.#NEP 2020|GER of 50% by 2035; 5+3+3+4 school structure; multidisciplinary universities.|Academic Bank of Credits; multiple entry and exit points; HECI proposed as a single regulator.|Target of 6% of GDP for education; mother tongue as the medium at least up to Grade 5.#Constitution and governance|Education moved to the Concurrent List (42nd Amendment, 1976).|Article 21A, Right to Education (86th Amendment, 2002). Articles 29–30: minority educational rights.|Article 45: early childhood care. Article 46: education of SCs, STs and weaker sections. Article 350A: teaching in the mother tongue.|Types of universities: central, state, deemed, private; Institutes of National Importance (IITs, AIIMS).#Exam tips|Dates and committee names come up often, so build a timeline.'};
function learn(k){let h='';for(const part of NOTES[k].split('#').filter(Boolean)){const [head,...pts]=part.split('|');h+=`<h3>${esc(head)}</h3><ul>${pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
  $('lt').textContent=TN(k);$('lb').innerHTML=h;$('lgo').onclick=()=>run([k]);show('learn');scrollTo(0,0)}

const LK='aptPlay2',lload=()=>{try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return{}}},lsave=d=>{try{localStorage.setItem(LK,JSON.stringify(d))}catch(e){}};

const $=id=>document.getElementById(id),msg=t=>$('lmsg').textContent=t,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function boot(){let db=null,user=null;
  if(window.claude?.use){[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}
  if(db&&user){try{const id=await user.id(),me=await user.me();if(id){const col=db.collection('data/users/'+id);
    hist=(await col.orderBy('d').limit(1000).get()).docs.map(d=>d.data());
    saveRec=r=>col.doc(String(r.d)).set(r);$('who').textContent=(me.name||'Signed in')+' · synced';return enter()}}catch(e){}}
  $('who').textContent='';show('login')}
async function hash(s){if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}
async function login(create){const u=$('u').value.trim().toLowerCase(),p=$('p').value;if(!u||!p)return msg('Enter a name and PIN.');const h=await hash(u+':'+p);
  if(create){if(ldb[u])return msg('That name exists. Sign in instead.');ldb[u]={h,hist:[]};lsave(ldb)}else if(!ldb[u]||ldb[u].h!=h)return msg('Wrong name or PIN.');
  hist=ldb[u].hist;saveRec=r=>lsave(ldb);$('who').innerHTML=`${esc(u)} · this device <button onclick="location.reload()">Sign out</button>`;enter()}
function show(s){['login','home','learn','quiz'].forEach(x=>$(x).hidden=x!=s);if(s=='home'){drawTabs();drawTopics();drawTrend()}}
function enter(){try{seg=localStorage.getItem('aptSeg')||'A'}catch(e){}if(!SEG[seg])seg='A';fillTrendSel();show('home')}
function setSeg(s){seg=s;try{localStorage.setItem('aptSeg',s)}catch(e){}fillTrendSel();show('home')}
function drawTabs(){$('tabs').innerHTML=Object.entries(SEG).map(([k,v])=>`<button aria-pressed="${k==seg}" onclick="setSeg('${k}')">${v.n}</button>`).join('');
  $('filter').hidden=seg!='A';$('segInfo').textContent=SEG[seg].d}
function fillTrendSel(){$('trendSel').innerHTML=`<option value="${seg}">All ${SEG[seg].n} quizzes</option>`+SEG[seg].t.map((t,i)=>`<option value="${key(seg,i)}">${i+1}. ${t[0]}</option>`).join('')}
function stats(k){const h=hist.filter(x=>x.t.includes(k));return h.length?Math.round(h.reduce((a,x)=>{const p=x.per.filter(z=>z[0]==k);return a+p.reduce((s,z)=>s+z[1],0)/p.length},0)/h.length*100)+'% avg · '+h.length+' quiz':'Not tried'}
function drawTopics(){const f=seg=='A'?$('filter').value:'all';$('topics').innerHTML=SEG[seg].t.map((t,i)=>{const old=seg=='A'&&OLD.includes(i+1);if(f=='old'&&!old||f=='new'&&old)return'';
  const tag=seg=='A'?`<span class="tag ${old?'old':''}">${old?'Old ✓':'New'} · ${i<35?'Arithmetic':'Data Interpretation'}</span>`:'';
  return`<button class="topic card" onclick="start(['${key(seg,i)}'])"><b>${i+1}. ${esc(t[0])}</b>${tag}<span class="tag">${stats(key(seg,i))}</span></button>`}).join('')}
function startMix(){let ks=SEG[seg].t.map((_,i)=>key(seg,i));if(seg=='A'&&$('filter').value!='all')ks=ks.filter(k=>OLD.includes(+k.slice(1)+1)==($('filter').value=='old'));start(ks)}
// ---- quiz ----
const gen=k=>SEG[k[0]].t[+k.slice(1)][1];
function mk(k){const g=gen(k)();let o=g.opts?[...g.opts]:null;if(!o){if(g.str){const s=new Set([g.a]);for(let j=0;j<12&&s.size<4;j++)s.add(gen(k)().a);o=[...s]}
  else{const I=Number.isInteger(g.a),s=new Set([g.a]),st=I?Math.max(1,Math.round(Math.abs(g.a)*.1)):Math.max(.1,+(Math.abs(g.a)*.1).toFixed(1));let n=1;while(s.size<4){const x=+(g.a+P([-1,1])*st*n).toFixed(I?0:2);if(x!==g.a)s.add(x);n++}o=[...s]}}
  return{...g,k,o:o.sort(()=>Math.random()-.5)}}
function start(ks){if(ks.length==1&&NOTES[ks[0]])return learn(ks[0]);run(ks)}
function run(ks){const n=+$('count').value,seen=new Set(),qs=[];for(let i=0;i<n;i++){let q;for(let j=0;j<8;j++){q=mk(P(ks));if(!seen.has(q.q))break}seen.add(q.q);qs.push(q)}
  quiz={seg,qs,k:0,s:0,t0:Date.now()};show('quiz');render()}
function render(){const q=quiz.qs[quiz.k];$('qt').textContent=TN(q.k)+(q.sub?' · '+q.sub:'');$('qn').textContent=`Q ${quiz.k+1}/${quiz.qs.length} · Score ${quiz.s}`;
  $('qv').innerHTML=q.v||'';$('qq').textContent=q.q;$('qf').textContent='';$('next').hidden=true;$('quit').textContent='Quit';
  $('qo').innerHTML=q.o.map((x,j)=>`<button onclick="pick(${j},this)">${esc(x)}</button>`).join('')}
function pick(j,b){const q=quiz.qs[quiz.k],ok=q.o[j]===q.a;[...$('qo').children].forEach((c,i)=>{c.disabled=true;if(q.o[i]===q.a)c.classList.add('ok')});
  if(ok)quiz.s++;else b.classList.add('bad');q.ok=ok;$('qf').textContent=ok?'Correct!':`Answer: ${q.a}${q.h?'. '+q.h:''}`;$('next').hidden=false;$('next').textContent=quiz.k+1<quiz.qs.length?'Next':'Finish'}
async function next(){if(++quiz.k<quiz.qs.length)return render();
  const r={d:Date.now(),seg:quiz.seg,t:[...new Set(quiz.qs.map(q=>q.k))],s:quiz.s,n:quiz.qs.length,sec:Math.round((Date.now()-quiz.t0)/1000),per:quiz.qs.map(q=>[q.k,q.ok?1:0])};
  hist.push(r);let note='Saved.';try{await saveRec(r)}catch(e){note='Could not save this score. Check your connection.'}
  $('qv').innerHTML='';$('qo').innerHTML='';$('qq').textContent=`Finished: ${r.s}/${r.n} (${Math.round(r.s/r.n*100)}%) in ${r.sec}s.`;$('qf').textContent=note;$('next').hidden=true;$('quit').textContent='Back to topics'}
// ---- trends ----
function drawTrend(){const sel=$('trendSel').value,all=sel.length==1,h=hist.filter(x=>all?(x.seg||'A')==sel:x.t.includes(sel)).slice(-20);
  if(!h.length){$('trend').innerHTML='<p class="mute">No quizzes yet. Pick a topic above to start; each finished quiz adds a point here.</p>'}else{const W=600,H=180,x=i=>45+i*(W-70)/Math.max(1,h.length-1),y=v=>H-25-v*(H-45);
  const pct=h.map(e=>{if(all)return e.s/e.n;const p=e.per.filter(z=>z[0]==sel);return p.reduce((a,z)=>a+z[1],0)/p.length});
  $('trend').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend">${[0,.5,1].map(v=>`<line x1="45" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="5" y="${y(v)+4}" font-size="11" fill="var(--mute)">${v*100}%</text>`).join('')}
  <polyline points="${pct.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>${pct.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i==pct.length-1?6:4}" fill="var(--pri)"><title>${new Date(h[i].d).toLocaleString()} · ${Math.round(v*100)}% · ${h[i].sec}s</title></circle>`).join('')}
  <text x="${x(pct.length-1)}" y="${y(pct.at(-1))-10}" font-size="12" text-anchor="end" fill="var(--ink)">${Math.round(pct.at(-1)*100)}%</text></svg>`}
  const acc={};hist.forEach(e=>e.per.forEach(([k,o])=>{if(k[0]!=seg)return;acc[k]=acc[k]||[0,0];acc[k][0]+=o;acc[k][1]++}));
  const w=Object.entries(acc).filter(e=>e[1][1]>=3).map(([k,[a,n]])=>[k,a/n]).sort((a,b)=>a[1]-b[1]).slice(0,3);
  $('weak').innerHTML=w.length?'Focus next: '+w.map(([k,v])=>`<b>${esc(TN(k))}</b> (${Math.round(v*100)}%)`).join(', '):''}
boot();
</script>
