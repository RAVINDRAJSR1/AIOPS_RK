rint(5 < 3)\\n\"\n                    \"print(10 == 10)\\n\"\n                    'print(\"cat\" != \"dog\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"The if line ends with a colon  :\\n\"\n                    \"The lines that belong to it are pushed right (INDENTED) by 4 spaces.\\n\"\n                    \"Those lines run ONLY if the condition is True.\"\n                ),\n                \"code\": (\n                    \"temperature = 38\\n\"\n                    \"if temperature > 35:\\n\"\n                    '    print(\"It is very hot! Drink water.\")\\n'\n                    'print(\"Have a nice day!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"else = what to do when the condition is False.\\n\"\n                    \"Let's check if a number is even or odd (remember % gives remainder).\"\n                ),\n                \"code\": (\n                    \"number = 7\\n\"\n                    \"if number % 2 == 0:\\n\"\n                    '    print(number, \"is EVEN\")\\n'\n                    \"else:\\n\"\n                    '    print(number, \"is ODD\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"elif means 'else if'. It lets us check many choices one after another.\\n\"\n                    \"Python stops at the FIRST one that is True.\"\n                ),\n                \"code\": (\n                    \"marks = 82\\n\"\n                    \"if marks >= 90:\\n\"\n                    '    print(\"Grade A+\")\\n'\n                    \"elif marks >= 75:\\n\"\n                    '    print(\"Grade A\")\\n'\n                    \"elif marks >= 50:\\n\"\n                    '    print(\"Grade B\")\\n'\n                    \"else:\\n\"\n                    '    print(\"Keep practising!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Join conditions with  and  /  or :\\n\"\n                    \"   and -> BOTH must be True\\n\"\n                    \"   or  -> at least ONE must be True\"\n                ),\n                \"code\": (\n                    \"age = 12\\n\"\n                    \"has_ticket = True\\n\"\n                    \"if age >= 10 and has_ticket:\\n\"\n                    '    print(\"You can enter the science show!\")\\n'\n                    'day = \"Sunday\"\\n'\n                    'if day == \"Saturday\" or day == \"Sunday\":\\n'\n                    '    print(\"Holiday!\")'\n                ),\n            },\n        ],\n        \"quiz\": [\n            {\n                \"q\": \"Which sign CHECKS if two things are equal?\",\n                \"options\": [\"=\", \"==\", \"===\", \"=>\"],\n                \"answer\": 1,\n                \"why\": \"== compares. A single = stores a value in a variable.\",\n            },\n            {\n                \"q\": \"What must come at the end of an if line?\",\n                \"options\": [\". (dot)\", \"; (semicolon)\", \": (colon)\", \"Nothing\"],\n                \"answer\": 2,\n                \"why\": \"if, elif and else lines always end with a colon :\",\n            },\n            {\n                \"q\": \"x = 4.  if x > 10: print('Big')  else: print('Small').  What is shown?\",\n                \"options\": [\"Big\", \"Small\", \"Big Small\", \"Nothing\"],\n                \"answer\": 1,\n                \"why\": \"4 > 10 is False, so the else part runs.\",\n            },\n        ],\n        \"challenge\": {\n            \"task\": \"Ask for a number. Print 'Positive', 'Negative' or 'Zero'.\",\n            \"hint\": \"Use if n > 0, elif n < 0, else.\",\n            \"solution\": (\n                'n = int(input(\"Enter a number: \"))\\n'\n                \"if n > 0:\\n\"\n                '    print(\"Positive\")\\n'\n                \"elif n < 0:\\n\"\n                '    print(\"Negative\")\\n'\n                \"else:\\n\"\n                '    print(\"Zero\")'\n            ),\n        },\n    },\n    # ------------------------------------------------------------------ 7\n    {\n        \"title\": \"for Loops - Repeat Without Getting Tired\",\n        \"goal\": \"Repeat instructions many times with a for loop.\",\n        \"steps\": [\n            {\n                \"explain\": (\n                    \"Your teacher says: 'Write I will not talk in class 5 times.'\\n\"\n                    \"Boring! A LOOP repeats instructions for us.\\n\\n\"\n                    \"range(5) gives the numbers 0, 1, 2, 3, 4  (5 numbers, starting at 0).\\n\"\n                    \"The indented lines run once for each number.\"\n                ),\n                \"code\": (\n                    \"for i in range(5):\\n\"\n                    '    print(\"I will practise Python!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"The variable (here  i ) holds the current number each time round.\\n\"\n                    \"range(1, 6) starts at 1 and stops BEFORE 6.\"\n                ),\n                \"code\": (\n                    \"for i in range(1, 6):\\n\"\n                    '    print(\"Round number\", i)'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"A third number in range is the STEP (how much to jump).\\n\"\n                    \"range(2, 21, 2) gives 2, 4, 6 ... 20  (even numbers).\"\n                ),\n                \"code\": (\n                    \"for n in range(2, 21, 2):\\n\"\n                    '    print(n, end=\" \")\\n'\n                    \"print()\\n\"\n                    \"# Counting down for a rocket!\\n\"\n                    \"for n in range(5, 0, -1):\\n\"\n                    \"    print(n)\\n\"\n                    'print(\"Blast off!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Let's make a multiplication table - in just 2 lines!\"\n                ),\n                \"code\": (\n                    \"number = 7\\n\"\n                    \"for i in range(1, 11):\\n\"\n                    '    print(number, \"x\", i, \"=\", number * i)'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Loops can ADD UP numbers. We start a 'total' box at 0\\n\"\n                    \"and add to it every time round. Sum of 1 to 10:\"\n                ),\n                \"code\": (\n                    \"total = 0\\n\"\n                    \"for i in range(1, 11):\\n\"\n                    \"    total = total + i\\n\"\n                    'print(\"Sum of 1 to 10 is\", total)'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"A for loop can also go through each letter of a string.\"\n                ),\n                \"code\": (\n                    'for letter in \"SCHOOL\":\\n'\n                    \"    print(letter)\"\n                ),\n            },\n        ],\n        \"quiz\": [\n            {\n                \"q\": \"Which numbers does range(4) give?\",\n                \"options\": [\"1, 2, 3, 4\", \"0, 1, 2, 3\", \"0, 1, 2, 3, 4\", \"4\"],\n                \"answer\": 1,\n                \"why\": \"range starts at 0 and stops BEFORE the number given.\",\n            },\n            {\n                \"q\": \"How many times will this print? for i in range(3, 8): print(i)\",\n                \"options\": [\"8\", \"5\", \"3\", \"6\"],\n                \"answer\": 1,\n                \"why\": \"3, 4, 5, 6, 7 = 5 numbers (8 is not included).\",\n            },\n            {\n                \"q\": \"What does range(10, 0, -2) start with?\",\n                \"options\": [\"0\", \"10\", \"8\", \"-2\"],\n                \"answer\": 1,\n                \"why\": \"It starts at 10 and jumps down by 2: 10, 8, 6, 4, 2.\",\n            },\n        ],\n        \"challenge\": {\n            \"task\": \"Print the squares of numbers from 1 to 10 (1, 4, 9, ... 100).\",\n            \"hint\": \"for i in range(1, 11): print(i * i)\",\n            \"solution\": \"for i in range(1, 11):\\n    print(i, \\\"squared is\\\", i * i)\",\n        },\n    },\n    # ------------------------------------------------------------------ 8\n    {\n        \"title\": \"while Loops - Repeat Until...\",\n        \"goal\": \"Repeat something as long as a condition is True.\",\n        \"steps\": [\n            {\n                \"explain\": (\n                    \"A for loop is good when we KNOW how many times to repeat.\\n\"\n                    \"A while loop keeps going AS LONG AS a condition is True.\\n\"\n                    \"Like: 'keep eating WHILE you are hungry'.\"\n                ),\n                \"code\": (\n                    \"count = 1\\n\"\n                    \"while count <= 5:\\n\"\n                    '    print(\"Count is\", count)\\n'\n                    \"    count = count + 1\\n\"\n                    'print(\"Done!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"WARNING: Always change something inside the loop so it can stop!\\n\"\n                    \"If count never grows, the loop runs FOREVER (an infinite loop).\\n\"\n                    \"If that ever happens, press Ctrl + C to stop it.\\n\\n\"\n                    \"Here: how many times can we double 1 before it is bigger than 100?\"\n                ),\n                \"code\": (\n                    \"number = 1\\n\"\n                    \"steps = 0\\n\"\n                    \"while number <= 100:\\n\"\n                    \"    number = number * 2\\n\"\n                    \"    steps = steps + 1\\n\"\n                    'print(\"It took\", steps, \"doublings to reach\", number)'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"while is great for asking again until the answer is right.\\n\"\n                    \"Try a wrong password first, then type: python\"\n                ),\n                \"code\": (\n                    'password = \"\"\\n'\n                    'while password != \"python\":\\n'\n                    '    password = input(\"Enter the secret password: \")\\n'\n                    'print(\"Access granted!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"break jumps OUT of a loop immediately.\\n\"\n                    \"Here we search for the first number divisible by 7 after 50.\"\n                ),\n                \"code\": (\n                    \"n = 51\\n\"\n                    \"while True:\\n\"\n                    \"    if n % 7 == 0:\\n\"\n                    \"        break\\n\"\n                    \"    n = n + 1\\n\"\n                    'print(\"First multiple of 7 after 50 is\", n)'\n                ),\n            },\n        ],\n        \"quiz\": [\n            {\n                \"q\": \"When does a while loop stop?\",\n                \"options\": [\n                    \"After 10 times\",\n                    \"When its condition becomes False\",\n                    \"Never\",\n                    \"When it prints something\",\n                ],\n                \"answer\": 1,\n                \"why\": \"while keeps repeating only as long as the condition is True.\",\n            },\n            {\n                \"q\": \"Which key combination stops a program stuck in an infinite loop?\",\n                \"options\": [\"Ctrl + S\", \"Ctrl + C\", \"Alt + F4 only\", \"Enter\"],\n                \"answer\": 1,\n                \"why\": \"Ctrl + C interrupts a running Python program.\",\n            },\n        ],\n        \"challenge\": {\n            \"task\": \"Use a while loop to print 10, 9, 8 ... 1 and then 'Happy New Year!'.\",\n            \"hint\": \"Start n = 10, loop while n >= 1, and do n = n - 1 inside.\",\n            \"solution\": 'n = 10\\nwhile n >= 1:\\n    print(n)\\n    n = n - 1\\nprint(\"Happy New Year!\")',\n        },\n    },\n    # ------------------------------------------------------------------ 9\n    {\n        \"title\": \"Lists - A Bag of Many Things\",\n        \"goal\": \"Keep many values together in one list.\",\n        \"steps\": [\n            {\n                \"explain\": (\n                    \"A variable is one box. A LIST is like a school bag with many items.\\n\"\n                    \"We write a list with square brackets [ ] and commas.\"\n                ),\n                \"code\": (\n                    'fruits = [\"apple\", \"banana\", \"mango\"]\\n'\n                    \"marks = [78, 92, 85, 64]\\n\"\n                    \"print(fruits)\\n\"\n                    \"print(marks)\"\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Just like letters in a string, items in a list have an INDEX starting at 0.\"\n                ),\n                \"code\": (\n                    'planets = [\"Mercury\", \"Venus\", \"Earth\", \"Mars\"]\\n'\n                    \"print(planets[0])\\n\"\n                    \"print(planets[2])\\n\"\n                    'print(\"Number of planets in list:\", len(planets))'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Lists can CHANGE:\\n\"\n                    \"   .append(x)  -> add x at the end\\n\"\n                    \"   .remove(x)  -> take x out\\n\"\n                    \"   list[i] = x -> replace the item at position i\"\n                ),\n                \"code\": (\n                    'bag = [\"book\", \"pencil\"]\\n'\n                    'bag.append(\"eraser\")\\n'\n                    \"print(bag)\\n\"\n                    'bag.remove(\"pencil\")\\n'\n                    \"print(bag)\\n\"\n                    'bag[0] = \"notebook\"\\n'\n                    \"print(bag)\"\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Loop over a list with for - Python gives you each item one by one.\"\n                ),\n                \"code\": (\n                    'friends = [\"Riya\", \"Arjun\", \"Sara\"]\\n'\n                    \"for friend in friends:\\n\"\n                    '    print(\"Happy birthday,\", friend + \"!\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Python has handy helpers for lists of numbers:\\n\"\n                    \"   sum()  max()  min()  sorted()\"\n                ),\n                \"code\": (\n                    \"marks = [78, 92, 85, 64, 88]\\n\"\n                    'print(\"Total:\", sum(marks))\\n'\n                    'print(\"Highest:\", max(marks))\\n'\n                    'print(\"Lowest:\", min(marks))\\n'\n                    'print(\"Average:\", sum(marks) / len(marks))\\n'\n                    'print(\"Sorted:\", sorted(marks))'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Use  in  to check if something is inside a list.\"\n                ),\n                \"code\": (\n                    'colours = [\"red\", \"green\", \"blue\"]\\n'\n                    'if \"green\" in colours:\\n'\n                    '    print(\"Yes, green is there!\")\\n'\n                    'print(\"pink\" in colours)'\n                ),\n            },\n        ],\n        \"quiz\": [\n            {\n                \"q\": 'nums = [5, 10, 15]. What is nums[1]?',\n                \"options\": [\"5\", \"10\", \"15\", \"1\"],\n                \"answer\": 1,\n                \"why\": \"Index 0 is 5, index 1 is 10.\",\n            },\n            {\n                \"q\": \"Which method adds an item at the END of a list?\",\n                \"options\": [\".add()\", \".push()\", \".append()\", \".insert_end()\"],\n                \"answer\": 2,\n                \"why\": \".append() adds to the end.\",\n            },\n            {\n                \"q\": \"What does len([3, 6, 9, 12]) give?\",\n                \"options\": [\"3\", \"4\", \"12\", \"30\"],\n                \"answer\": 1,\n                \"why\": \"There are 4 items in the list.\",\n            },\n        ],\n        \"challenge\": {\n            \"task\": \"Make a list of 5 of your favourite foods. Add one more, then print each on its own line.\",\n            \"hint\": \"foods = [...], foods.append(...), then a for loop.\",\n            \"solution\": (\n                'foods = [\"dosa\", \"pizza\", \"paneer\", \"momos\", \"kheer\"]\\n'\n                'foods.append(\"idli\")\\n'\n                \"for food in foods:\\n\"\n                \"    print(food)\"\n            ),\n        },\n    },\n    # ------------------------------------------------------------------ 10\n    {\n        \"title\": \"Functions - Your Own Commands\",\n        \"goal\": \"Create your own reusable instructions.\",\n        \"steps\": [\n            {\n                \"explain\": (\n                    \"A FUNCTION is a set of instructions with a name - like a recipe.\\n\"\n                    \"Write the recipe once, then use (CALL) it as many times as you like.\\n\\n\"\n                    \"We create one with  def  (short for 'define').\"\n                ),\n                \"code\": (\n                    \"def say_hello():\\n\"\n                    '    print(\"Hello!\")\\n'\n                    '    print(\"Welcome to Python class.\")\\n'\n                    \"\\n\"\n                    \"say_hello()\\n\"\n                    \"say_hello()\"\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Functions can take INPUTS called PARAMETERS, written inside the brackets.\\n\"\n                    \"It's like telling the recipe how many people to cook for.\"\n                ),\n                \"code\": (\n                    \"def greet(name):\\n\"\n                    '    print(\"Good morning,\", name)\\n'\n                    \"\\n\"\n                    'greet(\"Aditi\")\\n'\n                    'greet(\"Rohan\")'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"return sends an answer BACK from the function, so we can store or use it.\"\n                ),\n                \"code\": (\n                    \"def square(n):\\n\"\n                    \"    return n * n\\n\"\n                    \"\\n\"\n                    \"answer = square(6)\\n\"\n                    \"print(answer)\\n\"\n                    \"print(square(3) + square(4))\"\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Functions can take more than one input. Here is a useful one!\"\n                ),\n                \"code\": (\n                    \"def rectangle_area(length, breadth):\\n\"\n                    \"    return length * breadth\\n\"\n                    \"\\n\"\n                    'print(\"Room area:\", rectangle_area(5, 4))\\n'\n                    'print(\"Garden area:\", rectangle_area(12, 10))'\n                ),\n            },\n            {\n                \"explain\": (\n                    \"Putting it all together: a function that uses if/else and returns a word.\"\n                ),\n                \"code\": (\n                    \"def even_or_odd(n):\\n\"\n                    \"    if n % 2 == 0:\\n\"\n                    '        return \"even\"\\n'\n                    \"    else:\\n\"\n                    '        return \"odd\"\\n'\n                    \"\\n\"\n                    \"for number in [3, 8, 11, 20]:\\n\"\n                    '    print(number, \"is\", even_or_odd(number))'\n                ),\n            },\n        ],\n        \"quiz\": [\n            {\n                \"q\": \"Which word is used to create a function?\",\n                \"options\": [\"func\", \"def\", \"make\", \"function\"],\n                \"answer\": 1,\n                \"why\": \"def (define) starts a function.\",\n            },\n            {\n                \"q\": \"def double(x): return x * 2.   What is double(7)?\",\n                \"options\": [\"7\", \"9\", \"14\", \"72\"],\n                \"answer\": 2,\n                \"why\": \"7 * 2 = 14.\",\n            },\n            {\n                \"q\": \"What does return do?\",\n                \"options\": [\n                    \"Prints the answer\",\n                    \"Sends a value back to where the function was called\",\n                    \"Repeats the function\",\n                    \"Deletes the function\",\n                ],\n                \"answer\": 1,\n                \"why\": \"return gives a value back so the caller can use it.\",\n            },\n        ],\n        \"challenge\": {\n            \"task\": \"Write a function cube(n) that returns n * n * n. Print cube(3).\",\n            \"hint\": \"def cube(n):  then  return n * n * n\",\n            \"solution\": \"def cube(n):\\n    return n * n * n\\n\\nprint(cube(3))\",\n        },\n    },\n]\n", "playground.py": "\"\"\"\nPYTHON PLAYGROUND FOR CLASS 6\n=============================\n\nStart it by typing this in a terminal:\n\n    python playground.py\n\nThen just follow the instructions on the screen!\n\"\"\"\n\nimport code\nimport json\nimport os\nimport runpy\nimport sys\nimport traceback\n\nfrom lessons import LESSONS\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nPROGRESS_FILE = os.path.join(HERE, \"progress.json\")\nPROJECTS_DIR = os.path.join(HERE, \"projects\")\n\nPROJECTS = [\n    (\"guess_the_number.py\", \"Guess the Number game\", \"while loops, if/else, random\"),\n    (\"times_table_quiz.py\", \"Times Table Quiz\", \"for loops, input, scores\"),\n    (\"simple_calculator.py\", \"Simple Calculator\", \"functions, if/elif\"),\n    (\"story_maker.py\", \"Silly Story Maker\", \"strings, input, f-strings\"),\n    (\"report_card.py\", \"Report Card\", \"lists, sum, max, min, functions\"),\n    (\"turtle_art.py\", \"Turtle Drawing (opens a window)\", \"loops + drawing\"),\n]\n\n# Simple explanations for the most common mistakes beginners make.\nERROR_HINTS = {\n    \"SyntaxError\": \"Python could not understand the grammar. Check for missing quotes \\\" \\\", \"\n                   \"brackets ( ), or a colon : at the end of if / for / while / def lines.\",\n    \"IndentationError\": \"The spaces at the start of a line are wrong. Lines inside if / for / \"\n                        \"while / def must be pushed right by 4 spaces.\",\n    \"NameError\": \"Python does not know that name. Did you spell it correctly? Did you create \"\n                 \"the variable before using it? Did you forget quotes around text?\",\n    \"TypeError\": \"You mixed types that don't fit together, like text + number. \"\n                 \"Use str() to turn a number into text, or int() to turn text into a number.\",\n    \"ValueError\": \"The value was not what Python expected. For example int(\\\"hello\\\") fails \"\n                  \"because 'hello' is not a number.\",\n    \"ZeroDivisionError\": \"You tried to divide by zero. Nobody can do that, not even Python!\",\n    \"IndexError\": \"That position does not exist. Remember positions start at 0, so a list of \"\n                  \"3 items has positions 0, 1 and 2.\",\n    \"AttributeError\": \"That thing does not have that method. Check the spelling after the dot.\",\n    \"TimeoutError\": \"Your program ran for too long. Is there a loop that never stops? \"\n                    \"Check that something inside the loop changes so it can end.\",\n}\n\n\n# ----------------------------------------------------------------- helpers\ndef line(char=\"=\", width=60):\n    print(char * width)\n\n\ndef title(text):\n    print()\n    line()\n    print(\"  \" + text)\n    line()\n\n\ndef pause(message=\"Press Enter to continue...\"):\n    try:\n        return input(\"\\n\" + message).strip().lower()\n    except EOFError:\n        print()\n        return \"\"\n\n\ndef ask(prompt):\n    try:\n        return input(prompt).strip()\n    except EOFError:\n        print()\n        return \"q\"\n\n\ndef show_code(source):\n    print(\"\\n  +--- CODE \" + \"-\" * 44)\n    for number, text in enumerate(source.splitlines(), start=1):\n        print(f\"  | {number:>2}  {text}\")\n    print(\"  +\" + \"-\" * 53)\n\n\ndef error_hint(error_type):\n    # Check the most specific error first (IndentationError is a kind of SyntaxError).\n    for kind in getattr(error_type, \"__mro__\", ()):\n        if kind.__name__ in ERROR_HINTS:\n            return ERROR_HINTS[kind.__name__]\n    return \"Read the last line of the red message, it tells you what went wrong.\"\n\n\ndef explain_error(error_type):\n    print(f\"\\n  HELPER: {error_hint(error_type)}\")\n\n\ndef run_source(source):\n    \"\"\"Run some Python code and show its output (or a friendly error).\"\"\"\n    print(\"\\n  >>> OUTPUT:\")\n    try:\n        exec(compile(source, \"<your code>\", \"exec\"), {\"__name__\": \"__main__\"})\n    except KeyboardInterrupt:\n        print(\"\\n  (Stopped with Ctrl + C)\")\n    except Exception:\n        error_type = sys.exc_info()[0]\n        traceback.print_exc(limit=0, file=sys.stdout)\n        explain_error(error_type)\n    print(\"  <<< END OF OUTPUT\")\n\n\n# --------------------------------------------------------------- progress\ndef load_progress():\n    try:\n        with open(PROGRESS_FILE, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except (OSError, ValueError):\n        return {\"name\": \"\", \"stars\": {}}\n\n\ndef save_progress(progress):\n    try:\n        with open(PROGRESS_FILE, \"w\", encoding=\"utf-8\") as f:\n            json.dump(progress, f, indent=2)\n    except OSError:\n        pass  # Not being able to save should never stop the lesson.\n\n\n# ---------------------------------------------------------------- sandbox\nclass FriendlyConsole(code.InteractiveConsole):\n    \"\"\"A normal Python console that also explains errors in simple words.\"\"\"\n\n    def showsyntaxerror(self, filename=None, **kwargs):\n        super().showsyntaxerror(filename, **kwargs)\n        explain_error(sys.exc_info()[0])\n\n    def showtraceback(self):\n        super().showtraceback()\n        explain_error(sys.exc_info()[0])\n\n\ndef sandbox():\n    title(\"SANDBOX - try anything you like!\")\n    print(\"  Type Python code and press Enter to run it.\")\n    print(\"  For if / for / while / def: type the lines, then press Enter on an\")\n    print(\"  empty line to finish.  Type  done  to go back to the menu.\\n\")\n    console = FriendlyConsole()\n    more = False\n    while True:\n        try:\n            text = input(\"... \" if more else \">>> \")\n        except EOFError:\n            print()\n            break\n        except KeyboardInterrupt:\n            print(\"\\n  (Cleared)\")\n            console.resetbuffer()\n            more = False\n            continue\n        if not more and text.strip().lower() in (\"done\", \"exit\", \"quit\", \"exit()\", \"quit()\"):\n            break\n        try:\n            more = console.push(text)\n        except SystemExit:\n            break\n\n\ndef write_program():\n    \"\"\"Let the student type a whole program, then run it.\"\"\"\n    print(\"\\n  Type your program line by line. Use 4 spaces for indentation.\")\n    print(\"  When you are finished, type  run  on its own line.\\n\")\n    lines = []\n    while True:\n        try:\n            text = input(f\"  {len(lines) + 1:>2} | \")\n        except EOFError:\n            print()\n            break\n        if text.strip().lower() == \"run\":\n            break\n        lines.append(text)\n    if lines:\n        run_source(\"\\n\".join(lines))\n\n\n# ---------------------------------------------------------------- lessons\ndef run_quiz(lesson):\n    title(\"QUIZ TIME!\")\n    score = 0\n    for number, item in enumerate(lesson[\"quiz\"], start=1):\n        print(f\"\\n  Q{number}. {item['q']}\")\n        for i, option in enumerate(item[\"options\"]):\n            print(f\"      {chr(65 + i)}) {option}\")\n        letters = [chr(65 + i) for i in range(len(item[\"options\"]))]\n        while True:\n            reply = ask(\"  Your answer (A/B/C/D): \").upper()\n            if reply in letters or reply == \"Q\":\n                break\n            print(\"  Please type one of:\", \", \".join(letters))\n        if reply == \"Q\":\n            break\n        if letters.index(reply) == item[\"answer\"]:\n            score += 1\n            print(\"  CORRECT! Well done!\")\n        else:\n            right = letters[item[\"answer\"]]\n            print(f\"  Not quite. The answer is {right}) {item['options'][item['answer']]}\")\n        print(f\"  Why: {item['why']}\")\n    total = len(lesson[\"quiz\"])\n    print(f\"\\n  You scored {score} out of {total}.\")\n    if score == total:\n        print(\"  PERFECT SCORE! You are a Python star!\")\n    elif score >= total / 2:\n        print(\"  Good job! Look again at the ones you missed.\")\n    else:\n        print(\"  That's okay - every programmer learns by making mistakes. Try the lesson again!\")\n    return score\n\n\ndef run_challenge(lesson):\n    challenge = lesson[\"challenge\"]\n    title(\"YOUR CHALLENGE\")\n    print(\"  \" + challenge[\"task\"])\n    while True:\n        print(\"\\n  W = write and run your program   H = hint\")\n        print(\"  S = show the answer               Enter = finish lesson\")\n        choice = ask(\"  Choose: \").lower()\n        if choice == \"w\":\n            write_program()\n        elif choice == \"h\":\n            print(\"\\n  HINT: \" + challenge[\"hint\"])\n        elif choice == \"s\":\n            print(\"\\n  One possible answer (yours may be different and still correct!):\")\n            show_code(challenge[\"solution\"])\n            if ask(\"  Run it? (y/n): \").lower() == \"y\":\n                run_source(challenge[\"solution\"])\n        else:\n            return\n\n\ndef run_lesson(number, progress):\n    lesson = LESSONS[number - 1]\n    title(f\"LESSON {number}: {lesson['title']}\")\n    print(f\"  GOAL: {lesson['goal']}\")\n    steps = lesson[\"steps\"]\n    for step_number, step in enumerate(steps, start=1):\n        print()\n        line(\"-\")\n        print(f\"  STEP {step_number} of {len(steps)}\")\n        line(\"-\")\n        print(step[\"explain\"])\n        show_code(step[\"code\"])\n        if pause(\"Press Enter to RUN this code (or Q to go back to menu): \") == \"q\":\n            return\n        run_source(step[\"code\"])\n        print(\"\\n  Enter = next step   T = try it yourself in the sandbox   Q = menu\")\n        choice = pause(\"  Choose: \")\n        if choice == \"t\":\n            sandbox()\n        elif choice == \"q\":\n            return\n\n    score = run_quiz(lesson)\n    run_challenge(lesson)\n\n    key = str(number)\n    progress[\"stars\"][key] = max(score, progress[\"stars\"].get(key, 0))\n    save_progress(progress)\n    print(f\"\\n  Lesson {number} complete! Progress saved.\")\n    pause()\n\n\n# --------------------------------------------------------------- projects\ndef projects_menu():\n    while True:\n        title(\"MINI PROJECTS - real programs made from what you learnt\")\n        for i, (_, name, uses) in enumerate(PROJECTS, start=1):\n            print(f\"  {i}. {name:<34} uses: {uses}\")\n        print(\"\\n  Type a number to PLAY it, V + number to VIEW its code (e.g. V1),\")\n        print(\"  or press Enter to go back.\")\n        choice = ask(\"  Choose: \").lower()\n        if not choice or choice == \"q\":\n            return\n        view = choice.startswith(\"v\")\n        digits = choice[1:] if view else choice\n        if not digits.isdigit() or not 1 <= int(digits) <= len(PROJECTS):\n            print(\"  Please choose a number from the list.\")\n            continue\n        path = os.path.join(PROJECTS_DIR, PROJECTS[int(digits) - 1][0])\n        if view:\n            with open(path, encoding=\"utf-8\") as f:\n                show_code(f.read())\n            print(f\"  (This file is at: {path} - open it in an editor and change it!)\")\n            pause()\n            continue\n        print()\n        try:\n            runpy.run_path(path, run_name=\"__main__\")\n        except KeyboardInterrupt:\n            print(\"\\n  (Stopped)\")\n        except Exception:\n            traceback.print_exc(limit=0, file=sys.stdout)\n            explain_error(sys.exc_info()[0])\n        pause()\n\n\n# ------------------------------------------------------------------ menu\ndef main_menu(progress):\n    while True:\n        title(f\"PYTHON PLAYGROUND - Welcome, {progress['name']}!\")\n        print(\"  Do the lessons in order. Each one builds on the one before.\\n\")\n        for i, lesson in enumerate(LESSONS, start=1):\n            stars = progress[\"stars\"].get(str(i))\n            if stars is None:\n                badge = \"[ ]\"\n            else:\n                badge = \"[*] \" + \"*\" * stars\n            print(f\"  {i:>2}. {badge:<9} {lesson['title']}\")\n        print()\n        print(\"   S. Sandbox  - type any Python and see what happens\")\n        print(\"   P. Projects - play and read real mini programs\")\n        print(\"   Q. Quit\")\n        choice = ask(\"\\n  Type a lesson number or a letter: \").lower()\n        if choice == \"q\":\n            print(f\"\\n  Bye {progress['name']}! Keep coding every day!\\n\")\n            return\n        if choice == \"s\":\n            sandbox()\n        elif choice == \"p\":\n            projects_menu()\n        elif choice.isdigit() and 1 <= int(choice) <= len(LESSONS):\n            run_lesson(int(choice), progress)\n        else:\n            print(\"  Hmm, I don't know that one. Try again!\")\n\n\ndef main():\n    progress = load_progress()\n    title(\"HELLO, FUTURE PROGRAMMER!\")\n    print(\"  This playground teaches Python step by step.\")\n    print(\"  You will READ a little, SEE the code, RUN it, and then TRY it yourself.\")\n    if not progress[\"name\"]:\n        progress[\"name\"] = ask(\"\\n  What is your name? \") or \"Coder\"\n        if progress[\"name\"].lower() == \"q\":\n            progress[\"name\"] = \"Coder\"\n        save_progress(progress)\n    try:\n        main_menu(progress)\n    except KeyboardInterrupt:\n        print(\"\\n\\n  Bye! Your progress is saved.\\n\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "web_runner.py": "\"\"\"\nRuns student code for the web version of the playground (web/index.html).\n\nThe browser runs Python with Pyodide, which cannot pause a program to wait\nfor typing. So input() works by REPLAYING: when the program asks a question\nwe have no answer for yet, we stop and show the question. When the student\nanswers, the program runs again from the start with that answer filled in.\nrandom is seeded the same way each time, so a replay behaves exactly the same.\n\"\"\"\n\nimport contextlib\nimport io\nimport random\nimport sys\nimport traceback\n\nfrom playground import error_hint\n\nFILENAME = \"<your code>\"\nMAX_LINES = 1_000_000  # stops loops that never end, so the page cannot freeze\n\n\nclass NeedInput(BaseException):\n    \"\"\"Raised when the program asks for more answers than we have.\n\n    It is a BaseException so a student's own `except Exception:` cannot catch it.\n    \"\"\"\n\n\ndef run(source, answers=(), seed=0):\n    \"\"\"Run source and return what it printed.\n\n    Returns a dict with:\n      output  - everything printed (questions and answers included)\n      error   - the error message, or \"\" if it worked\n      hint    - a simple explanation of the error\n      waiting - True if the program stopped to wait for an answer\n    \"\"\"\n    answers = list(answers)\n    out = io.StringIO()\n    result = {\"output\": \"\", \"error\": \"\", \"hint\": \"\", \"waiting\": False}\n\n    def fake_input(prompt=\"\"):\n        out.write(str(prompt))\n        if not answers:\n            raise NeedInput()\n        answer = str(answers.pop(0))\n        out.write(answer + \"\\n\")\n        return answer\n\n    lines_run = 0\n\n    def count_lines(frame, event, arg):\n        nonlocal lines_run\n        if event == \"line\":\n            lines_run += 1\n            if lines_run > MAX_LINES:\n                raise TimeoutError(\"Your program ran for too long.\")\n        return count_lines\n\n    def trace_student_code(frame, event, arg):\n        return count_lines if frame.f_code.co_filename == FILENAME else None\n\n    random.seed(seed)\n    namespace = {\"__name__\": \"__main__\", \"input\": fake_input}\n    with contextlib.redirect_stdout(out):\n        try:\n            program = compile(source, FILENAME, \"exec\")\n            sys.settrace(trace_student_code)\n            try:\n                exec(program, namespace)\n            finally:\n                sys.settrace(None)\n        except NeedInput:\n            result[\"waiting\"] = True\n        except Exception as error:\n            result[\"error\"] = \"\".join(traceback.format_exception_only(type(error), error)).rstrip()\n            result[\"hint\"] = error_hint(type(error))\n    result[\"output\"] = out.getvalue()\n    return result\n"}}</script>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("playground-data").textContent);
const LESSONS = DATA.lessons;
const LETTERS = "ABCD";

// ---------- small helpers ----------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else if (value === true) el.setAttribute(key, "");
    else if (value !== false && value != null) el.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem("py6." + key));
    localStorage.setItem("py6." + key, JSON.stringify(value));
  } catch (e) { return null; }
}

// Explanations are plain text. Lines that start with spaces are examples,
// so they are shown in the code font.
function renderExplain(text) {
  const box = h("div", { class: "explain" });
  for (const para of text.split("\n\n")) {
    let words = [], code = [];
    const flushWords = () => { if (words.length) { box.append(h("p", {}, ...words.flatMap((w, i) => i ? [h("br"), w] : [w]))); words = []; } };
    const flushCode = () => { if (code.length) { box.append(h("pre", {}, code.join("\n"))); code = []; } };
    for (const line of para.split("\n")) {
      if (/^\s{2,}\S/.test(line)) { flushWords(); code.push(line.replace(/^\s{2,3}/, "")); }
      else { flushCode(); words.push(line); }
    }
    flushWords(); flushCode();
  }
  return box;
}

// ---------- Python (Pyodide) ----------
let runPy = null;
const statusEl = document.getElementById("status");
const readyWaiters = [];

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = h("script", { src });
    s.onload = resolve; s.onerror = () => reject(new Error("Could not load " + src));
    document.head.append(s);
  });
}

async function startPython() {
  const base = document.querySelector('meta[name="pyodide-base"]').content;
  try {
    await loadScript(base + "pyodide.js");
    const pyodide = await loadPyodide({ indexURL: base });
    for (const [name, text] of Object.entries(DATA.files)) pyodide.FS.writeFile(name, text);
    pyodide.runPython("import sys, os; sys.path.insert(0, os.getcwd())");
    const run = pyodide.pyimport("web_runner").run;
    runPy = (code, answers, seed) => {
      const pyAnswers = pyodide.toPy(answers);
      const result = run(code, pyAnswers, seed);
      const plain = result.toJs({ dict_converter: Object.fromEntries });
      result.destroy(); pyAnswers.destroy();
      return plain;
    };
    statusEl.textContent = "Python ready";
    statusEl.dataset.state = "ready";
  } catch (error) {
    console.error(error);
    statusEl.textContent = "Python could not load. Check your internet and refresh.";
    statusEl.dataset.state = "failed";
  }
  readyWaiters.splice(0).forEach(fn => fn());
}

// ---------- the code runner (editor + output) ----------
function makeRunner(startCode, { file = "main.py", autoRun = false } = {}) {
  const editor = h("textarea", { class: "editor", spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": "Python code" });
  editor.value = startCode;
  const runBtn = h("button", { class: "btn primary", type: "button" }, "▶ Run");
  const resetBtn = h("button", { class: "btn", type: "button", title: "Put the original code back" }, "Reset");
  const out = h("pre", { class: "out", "aria-live": "polite" });
  const askLabel = h("div", { class: "ask-label" }, "Your program is asking a question. Type your answer and press Enter.");
  const askInput = h("input", { type: "text", "aria-label": "Your answer", autocomplete: "off" });
  const ask = h("form", { class: "ask", hidden: true }, askLabel, askInput, h("button", { class: "btn", type: "submit" }, "Send"));
  const err = h("div", { class: "err", hidden: true });
  const helper = h("div", { class: "helper", hidden: true });
  const consoleBox = h("div", { class: "console", hidden: true }, h("div", { class: "console-head" }, "Output"), out, ask, err, helper);

  let answers = [], seed = 0;

  function fit() { editor.rows = Math.max(3, editor.value.split("\n").length + 1); }

  function execute() {
    consoleBox.hidden = false;
    if (!runPy) {
      out.replaceChildren(h("span", { class: "empty" }, statusEl.dataset.state === "failed"
        ? "Python could not load, so code cannot run. Check your internet connection and refresh the page."
        : "Python is still loading. Your code will run in a moment…"));
      if (statusEl.dataset.state !== "failed") readyWaiters.push(execute);
      return;
    }
    runBtn.disabled = true; runBtn.textContent = "Running…"; ask.hidden = true;
    setTimeout(() => {
      const r = runPy(editor.value, answers, seed);
      runBtn.disabled = false; runBtn.textContent = "▶ Run";
      if (r.output) out.textContent = r.output;
      else out.replaceChildren(h("span", { class: "empty" }, r.error || r.waiting ? "" : "(Your program ran but did not print anything.)"));
      err.hidden = !r.error; err.textContent = r.error;
      helper.hidden = !r.hint; helper.replaceChildren(h("b", {}, "Helper"), r.hint);
      ask.hidden = !r.waiting;
      if (r.waiting) { askInput.value = ""; askInput.focus({ preventScroll: true }); askInput.scrollIntoView({ block: "nearest" }); }
    }, 20);
  }
  function runFresh() { answers = []; seed = Math.floor(Math.random() * 1e9); execute(); }

  ask.addEventListener("submit", e => { e.preventDefault(); answers.push(askInput.value); execute(); });
  runBtn.addEventListener("click", runFresh);
  resetBtn.addEventListener("click", () => { editor.value = startCode; fit(); editor.focus(); });

  let escaped = false;
  editor.addEventListener("input", fit);
  editor.addEventListener("keydown", e => {
    const { selectionStart: start, selectionEnd: end, value } = editor;
    if (e.key === "Escape") { escaped = true; return; }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runFresh(); return; }
    if (e.key === "Tab" && !e.shiftKey && !escaped) {
      e.preventDefault(); editor.setRangeText("    ", start, end, "end"); fit(); return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      // Keep the same indentation, and add 4 spaces after a line ending in ":"
      const lineStart = value.lastIndexOf("\n", start - 1) + 1;
      const current = value.slice(lineStart, start);
      let indent = current.match(/^ */)[0];
      if (current.trimEnd().endsWith(":")) indent += "    ";
      e.preventDefault(); editor.setRangeText("\n" + indent, start, end, "end"); fit(); return;
    }
    escaped = false;
  });
  fit();

  const el = h("div", { class: "runner" },
    h("div", { class: "bar" }, h("span", { class: "file" }, file), resetBtn, runBtn),
    editor, consoleBox);
  if (autoRun) runFresh();
  return el;
}

// ---------- progress ----------
let stars = store("stars") || {};
function starText(n, total) { return "★".repeat(n) + "☆".repeat(Math.max(0, total - n)); }

// ---------- navigation ----------
let view = store("view") || { kind: "lesson", lesson: 0, stage: "step", step: 0 };
if (view.kind === "lesson" && !LESSONS[view.lesson]) view = { kind: "lesson", lesson: 0, stage: "step", step: 0 };

function go(next) {
  view = next; store("view", view); render();
  document.getElementById("main").scrollTo?.(0, 0); window.scrollTo(0, 0);
}

function renderNav() {
  const nav = document.getElementById("nav");
  const items = [h("div", { class: "nav-label" }, "Lessons")];
  LESSONS.forEach((lesson, i) => {
    const got = stars[i + 1];
    items.push(h("button", {
      class: "nav-item" + (got != null ? " done" : ""), type: "button",
      "aria-current": String(view.kind === "lesson" && view.lesson === i),
      onclick: () => go({ kind: "lesson", lesson: i, stage: "step", step: 0 }),
    }, h("span", { class: "nav-num" }, got != null ? "✓" : i + 1),
       h("span", { class: "nav-title" }, lesson.title),
       h("span", { class: "nav-stars", title: got != null ? `${got} of ${lesson.quiz.length} quiz answers right` : "" }, got != null ? starText(got, lesson.quiz.length) : "")));
  });
  items.push(h("div", { class: "nav-label" }, "Practice"));
  items.push(h("button", { class: "nav-item", type: "button", "aria-current": String(view.kind === "sandbox"), onclick: () => go({ kind: "sandbox" }) },
    h("span", { class: "nav-num" }, "✎"), h("span", { class: "nav-title" }, "Sandbox"), ""));
  items.push(h("button", { class: "nav-item", type: "button", "aria-current": String(view.kind === "projects"), onclick: () => go({ kind: "projects", project: 0 }) },
    h("span", { class: "nav-num" }, "★"), h("span", { class: "nav-title" }, "Mini projects"), ""));
  nav.replaceChildren(...items);
}

function lessonHeader(i) {
  const lesson = LESSONS[i];
  return h("div", {},
    h("div", { class: "eyebrow" }, `Lesson ${i + 1} of ${LESSONS.length}`),
    h("h2", {}, lesson.title),
    h("div", { class: "goal" }, h("b", {}, "Goal"), lesson.goal));
}

function renderStep(i, s) {
  const lesson = LESSONS[i], step = lesson.steps[s], last = s === lesson.steps.length - 1;
  const dots = lesson.steps.map((_, k) => h("button", {
    class: "dot" + (k === s ? " now" : k < s ? " seen" : ""), type: "button", "aria-label": `Step ${k + 1}`,
    onclick: () => go({ kind: "lesson", lesson: i, stage: "step", step: k }),
  }));
  return [
    lessonHeader(i),
    h("div", { class: "steps" }, dots, h("span", { class: "count" }, `Step ${s + 1} of ${lesson.steps.length}, then a quiz`)),
    h("div", { class: "card" }, renderExplain(step.explain)),
    h("div", {}, h("h3", {}, "Run it, then change it!"),
      h("p", { class: "tip" }, "Press ▶ Run to see what happens. Then edit the code and run it again. Shortcut: ", h("kbd", {}, "Ctrl"), " + ", h("kbd", {}, "Enter"), ".")),
    makeRunner(step.code, { file: `lesson${i + 1}_step${s + 1}.py` }),
    h("div", { class: "nav-row" },
      h("button", { class: "btn big", type: "button", disabled: s === 0, onclick: () => go({ kind: "lesson", lesson: i, stage: "step", step: s - 1 }) }, "← Back"),
      h("button", { class: "btn big primary", type: "button", onclick: () => go(last
        ? { kind: "lesson", lesson: i, stage: "quiz" }
        : { kind: "lesson", lesson: i, stage: "step", step: s + 1 }) }, last ? "Quiz time →" : "Next step →")),
  ];
}

function renderQuiz(i) {
  const lesson = LESSONS[i];
  let answered = 0, score = 0;
  const result = h("div", { class: "card", hidden: true });
  const questions = lesson.quiz.map((item, n) => {
    const why = h("div", { class: "why", hidden: true });
    const buttons = item.options.map((option, k) => h("button", {
      class: "opt", type: "button",
      onclick: () => {
        const right = k === item.answer;
        buttons.forEach(b => { b.disabled = true; });
        buttons[item.answer].classList.add("right");
        if (!right) buttons[k].classList.add("wrong");
        why.hidden = false; why.className = "why " + (right ? "right" : "wrong");
        why.replaceChildren(h("b", {}, right ? "Correct! " : `Not quite. The answer is ${LETTERS[item.answer]}. `), item.why);
        answered++; if (right) score++;
        if (answered === lesson.quiz.length) showResult();
      },
    }, h("b", {}, LETTERS[k]), option));
    return h("div", { class: "card q" }, h("div", { class: "q-text" }, `${n + 1}. ${item.q}`), h("div", { class: "options" }, buttons), why);
  });
  function showResult() {
    stars[i + 1] = Math.max(score, stars[i + 1] ?? 0); store("stars", stars); renderNav();
    const total = lesson.quiz.length;
    const words = score === total ? "Perfect score! You are a Python star!"
      : score >= total / 2 ? "Good job! Look again at the ones you missed."
      : "That's okay. Every programmer learns from mistakes. Read the lesson again and retry.";
    result.hidden = false;
    result.replaceChildren(
      h("div", { class: "stars", "aria-hidden": "true" }, starText(score, total)),
      h("div", { class: "score" }, `You got ${score} out of ${total}`), h("p", {}, words),
      h("div", { class: "nav-row" },
        h("button", { class: "btn big", type: "button", onclick: () => go({ kind: "lesson", lesson: i, stage: "quiz" }) }, "Try the quiz again"),
        h("button", { class: "btn big primary", type: "button", onclick: () => go({ kind: "lesson", lesson: i, stage: "challenge" }) }, "Your challenge →")));
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  return [lessonHeader(i), h("h3", {}, "Quiz time! Tap an answer."), ...questions, result];
}

function renderChallenge(i) {
  const lesson = LESSONS[i], c = lesson.challenge, next = i + 1 < LESSONS.length;
  const hint = h("div", { class: "helper", hidden: true }, h("b", {}, "Hint"), c.hint);
  const solution = h("div", { class: "card solution", hidden: true });
  const runnerHolder = h("div", {}, makeRunner("# Write your program here\n", { file: "my_challenge.py" }));
  solution.append(
    h("b", {}, "One possible answer. Yours can be different and still be correct!"),
    h("pre", {}, c.solution),
    h("button", { class: "btn", type: "button", onclick: () => runnerHolder.replaceChildren(makeRunner(c.solution, { file: "answer.py", autoRun: true })) }, "Put this answer in the editor and run it"));
  return [
    lessonHeader(i),
    h("div", { class: "card" }, h("div", { class: "eyebrow" }, "Your challenge"), h("p", { style: "margin:.3em 0 0;font-size:1.1rem" }, c.task)),
    runnerHolder,
    h("div", { class: "nav-row" },
      h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
        h("button", { class: "btn", type: "button", onclick: () => { hint.hidden = false; } }, "Show a hint"),
        h("button", { class: "btn", type: "button", onclick: () => { solution.hidden = false; } }, "Show the answer")),
      next
        ? h("button", { class: "btn big primary", type: "button", onclick: () => go({ kind: "lesson", lesson: i + 1, stage: "step", step: 0 }) }, `Next: Lesson ${i + 2} →`)
        : h("button", { class: "btn big primary", type: "button", onclick: () => go({ kind: "projects", project: 0 }) }, "Try the mini projects →")),
    hint, solution,
  ];
}

function renderSandbox() {
  return [
    h("div", {}, h("div", { class: "eyebrow" }, "Practice"), h("h2", {}, "Sandbox")),
    h("p", {}, "A free space to try anything. Mix what you learnt: print, variables, if, loops, lists, functions."),
    makeRunner('name = input("What is your name? ")\nfor i in range(3):\n    print("Hello", name)\n', { file: "sandbox.py" }),
  ];
}

function renderProjects(p) {
  const project = DATA.projects[p] || DATA.projects[0];
  const cards = DATA.projects.map((pr, k) => h("button", {
    class: "card project", type: "button", "aria-current": String(k === p),
    onclick: () => go({ kind: "projects", project: k }),
  }, h("h3", {}, pr.name), h("small", {}, "Uses: " + pr.uses)));
  return [
    h("div", {}, h("div", { class: "eyebrow" }, "Practice"), h("h2", {}, "Mini projects"),
      h("p", { class: "tip" }, "Real programs made from what you learnt. Press Run to play. Read the TRY THIS ideas at the bottom and change the code! (The turtle drawing project only works in the desktop version.)")),
    h("div", { class: "projects" }, cards),
    h("h3", {}, project.name),
    makeRunner(project.code, { file: project.name.toLowerCase().replace(/\W+/g, "_") + ".py" }),
  ];
}

function render() {
  renderNav();
  let parts;
  if (view.kind === "sandbox") parts = renderSandbox();
  else if (view.kind === "projects") parts = renderProjects(view.project || 0);
  else if (view.stage === "quiz") parts = renderQuiz(view.lesson);
  else if (view.stage === "challenge") parts = renderChallenge(view.lesson);
  else parts = renderStep(view.lesson, Math.min(view.step || 0, LESSONS[view.lesson].steps.length - 1));
  document.getElementById("main").replaceChildren(h("div", { class: "page" }, parts));
}

render();
startPython();
</script>
